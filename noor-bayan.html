<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نور البيان | سنابل الوحي</title>
<link rel="icon" href="/assets/logo-sanabil-icon-v6.png">
<link rel="preconnect" href="https://fvzoogbdezueswyihxiz.supabase.co" crossorigin>
<style>
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{--deep:#073c34;--gold:#d8bd88;--cream:#f8f5ee;--line:#dce7e2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:Alyamama,Tahoma,sans-serif;color:var(--deep)}
header{background:#fff;border-bottom:1px solid #eadfc9;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 14px;position:sticky;top:0;z-index:5}
header img{width:124px;height:auto}.meta{display:flex;align-items:center;gap:8px}.chip,.btn{border:1px solid #d6e4de;border-radius:12px;background:#eef7f4;color:var(--deep);padding:8px 12px;font:inherit;font-weight:700;text-decoration:none}.btn{cursor:pointer;background:#fff}
main{max-width:1100px;margin:auto;padding:10px}.intro{background:linear-gradient(135deg,#073c34,#0c6754);color:white;border-radius:18px;padding:12px 16px;margin-bottom:9px}.intro b{color:var(--gold)}
nav{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0;flex-wrap:wrap}
.viewer{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;height:calc(100vh - 225px);min-height:560px;box-shadow:0 8px 28px #183c3310}
.viewer iframe{display:block;width:100%;height:100%;border:0;background:#fff}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#fff;color:#687a73;pointer-events:none;transition:opacity .18s}.loading.hidden{opacity:0}
@media(max-width:700px){header img{width:105px}main{padding:6px}.intro{padding:10px 12px}.viewer{height:calc(100vh - 205px);min-height:510px}}
</style>
</head>
<body>
<header>
<img src="/assets/logo-sanabil-v6.png" alt="سنابل الوحي">
<div class="meta"><span class="chip" id="pageChip">نور البيان</span><a class="btn" href="/" rel="noopener">العودة للمنصة</a></div>
</header>
<main>
<section class="intro"><b>كتاب نور البيان</b><div id="lessonTitle">معاينة صفحة الدرس.</div></section>
<nav><button class="btn" id="prev">الصفحة السابقة</button><button class="btn" id="next">الصفحة التالية</button></nav>
<section class="viewer">
  <div class="loading" id="loading">جارٍ فتح الصفحة…</div>
  <iframe id="pdfFrame" title="صفحة الدرس من كتاب نور البيان" loading="eager"></iframe>
</section>
</main>
<script>
(()=>{'use strict';
 const PROXY='https://fvzoogbdezueswyihxiz.supabase.co/functions/v1/noor-bayan-book';
 const p=new URLSearchParams(location.search);let page=Math.min(98,Math.max(1,Number(p.get('page')||3)||3));
 const to=Math.min(98,Math.max(page,Number(p.get('to')||page)||page)),title=(p.get('title')||'').slice(0,140);
 const frame=document.getElementById('pdfFrame'),loading=document.getElementById('loading'),chip=document.getElementById('pageChip'),lt=document.getElementById('lessonTitle');
 let loadTimer=0;
 const src=()=>PROXY+'?cache=20261002-v13.0.7#page='+page+'&zoom=page-width&view=FitH';
 const openPage=()=>{
   chip.textContent=page===to?'صفحة '+page:'صفحات '+page+'–'+to;
   lt.textContent=title||'معاينة صفحة الدرس.';
   loading.classList.remove('hidden');clearTimeout(loadTimer);
   frame.src=src();
   loadTimer=setTimeout(()=>loading.classList.add('hidden'),1100);
   history.replaceState(null,'','?v=20261002-v13.0.7&page='+page+(to!==page?'&to='+to:'')+(title?'&title='+encodeURIComponent(title):''));
 };
 frame.addEventListener('load',()=>setTimeout(()=>loading.classList.add('hidden'),120));
 document.getElementById('prev').onclick=()=>{page=Math.max(1,page-1);openPage()};
 document.getElementById('next').onclick=()=>{page=Math.min(98,page+1);openPage()};
 openPage();
})();
</script>
</body></html>
