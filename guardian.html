<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بوابة ولي الأمر | سنابل الوحي</title>
<link rel="icon" href="/assets/logo-sanabil-icon-v6.png">
<style>
:root{--teal:#00808A;--teal-dark:#075f64;--gold:#D8BD88;--ink:#173d35;--muted:#6d8079;--bg:#f4f2ec;--line:#dfe8e3;--ok:#147a59;--warn:#9a6b22;--danger:#a0444c}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:radial-gradient(circle at 15% 0,#e5f2ef 0,#f4f2ec 34%,#f7f5f0 100%);color:var(--ink);min-height:100vh}
.wrap{max-width:1080px;margin:auto;padding:18px 18px 42px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#075b61,#00808A 68%,#1f8f94);color:#fff;border-radius:28px;padding:22px 24px;box-shadow:0 18px 48px #004e5530}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff28;border-radius:50%}.hero:before{width:280px;height:280px;left:-110px;top:-185px}.hero:after{width:180px;height:180px;right:-60px;bottom:-120px}
.hero-brand{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:18px;border-bottom:1px solid #ffffff28}.hero-brand img{width:132px;height:58px;object-fit:contain;background:#fff;border-radius:14px;padding:7px}.hero-brand span{font-size:14px;font-weight:800;background:#ffffff19;border:1px solid #ffffff2b;border-radius:999px;padding:7px 12px}
.hero-student{position:relative;z-index:1;display:flex;align-items:center;gap:15px;padding-top:20px}.avatar{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#fff5d9,#e8cc92);color:#075f64;font-size:30px;font-weight:900;box-shadow:inset 0 0 0 1px #ffffff77}
.hero h1{margin:0 0 7px;font-size:clamp(25px,4vw,38px)}.hero-meta{display:flex;flex-wrap:wrap;gap:7px}.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:#ffffff18;border:1px solid #ffffff24;padding:6px 9px;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:16px 0}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 8px 24px #173d350b;position:relative;overflow:hidden}.card:before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:linear-gradient(var(--gold),var(--teal))}.card span{display:block;font-size:12px;color:var(--muted)}.card b{display:block;margin-top:3px;font-size:27px;color:var(--teal-dark)}
.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:13px 0;box-shadow:0 8px 24px #173d3509}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.panel h2{margin:0;font-size:19px;color:#0b635d}.panel-sub{color:var(--muted);font-size:12px}
.assignment-grid,.plan-grid,.test-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.assignment,.plan-card,.test-card{border:1px solid #e1eae6;border-radius:16px;padding:13px;background:linear-gradient(145deg,#fff,#fbfdfc)}.assignment strong,.plan-card strong,.test-card strong{display:block;color:#086b64;margin-bottom:5px}.assignment .route{font-weight:800;line-height:1.75;color:#274f47}.assignment small,.plan-card small,.test-card small{color:var(--muted)}
.outcome-list{display:grid;gap:10px}.outcome-item{border:1px solid #e3ebe7;border-radius:16px;padding:13px;background:#fff}.outcome-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.outcome-date{font-weight:800;color:#315b52}.track-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.track{background:#f7faf8;border-radius:12px;padding:10px}.track b{display:block;color:#0a6962;font-size:13px}.track p{margin:5px 0 7px;font-size:12px;line-height:1.7}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#edf7f6;color:#006b74;font-weight:800;font-size:12px}.metrics{margin-top:8px;color:var(--muted);font-size:12px}
.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1ef;text-align:right;vertical-align:top}.table th{background:#f1f7f5;position:sticky;top:0}.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.notice{padding:12px 0;border-bottom:1px solid #edf1ef}.notice:last-child{border-bottom:0}.notice b{color:#086b64}.muted{color:var(--muted)}.error{background:#fff1f1;color:#8c2230;border:1px solid #e8bfc4;border-radius:16px;padding:18px}.back{display:inline-flex;align-items:center;justify-content:center;margin-top:14px;color:#fff;background:linear-gradient(135deg,#00747c,#075f64);text-decoration:none;font-weight:800;padding:11px 16px;border-radius:13px}.loading{text-align:center;padding:80px 20px;font-size:19px}
.footer-note{text-align:center;color:#788a83;font-size:12px;margin-top:18px}
@media(max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.assignment-grid,.plan-grid,.test-grid{grid-template-columns:1fr}.track-grid{grid-template-columns:1fr 1fr}.wrap{padding:12px}.hero{border-radius:22px;padding:16px}.panel{padding:14px;border-radius:17px}}
@media(max-width:520px){.hero-brand img{width:110px;height:48px}.hero-brand span{font-size:11px}.hero-student{align-items:flex-start}.avatar{width:54px;height:54px;border-radius:16px;font-size:24px}.hero h1{font-size:24px}.cards{gap:8px}.card{padding:12px}.card b{font-size:23px}.track-grid{grid-template-columns:1fr}.outcome-top{align-items:flex-start}.panel-head{align-items:flex-start}.table{min-width:620px}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">جارٍ فتح بوابة ولي الأمر…</div></div>
<script>
(()=>{'use strict';
const API='https://fvzoogbdezueswyihxiz.supabase.co/functions/v1/sanabil-guardian';
const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>x?new Date(x).toLocaleDateString('ar-SA',{timeZone:'Asia/Riyadh'}):'—';
const attend={present:'حاضر',late:'متأخر',excused:'مستأذن',absent:'غائب'};
const types={memorization:'حفظ جديد',recent_review:'مراجعة قريبة',review:'مراجعة كبرى'};
const qref=r=>r?((r.surahName||r.surah||'سورة')+' '+(r.ayahNo||r.ayah||'')):'—';
const gradeScore=s=>s>=90?'ممتاز':s>=80?'جيد جدًا':s>=70?'جيد':s>0?'يحتاج متابعة':'—';
const code=new URLSearchParams(location.search).get('code')||'';
if(!/^[A-Fa-f0-9]{32}$/.test(code)){
 app.innerHTML='<div class="error">رابط ولي الأمر غير مكتمل أو غير صالح.</div><a class="back" href="/">العودة إلى سنابل الوحي</a>';return;
}
fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})})
.then(async r=>{const j=await r.json().catch(()=>({error:'تعذر قراءة الاستجابة.'}));if(!r.ok||j.error)throw Error(j.error||'تعذر فتح البوابة.');return j})
.then(d=>{
 const a=d.attendance||[],o=d.outcomes||[],t=d.tests||[],p=d.plans||[],next=d.nextAssignments||[],aw=d.awards||[],an=d.announcements||[];
 const present=a.filter(x=>x.status==='present'||x.status==='late').length;
 const attRate=a.length?Math.round(present/a.length*100):0;
 const ratings=x=>[x.memorization_rating,x.recent_review_rating,x.review_rating].filter(Boolean);const allRatings=o.flatMap(ratings);const outcomeRate=allRatings.length?Math.round(allRatings.filter(x=>['ممتاز','جيد جدًا','جيد'].includes(x)).length/allRatings.length*100):0;
 const latest=t[0]?.scores?.total??'—';
 const initial=(d.student.fullName||'ط').trim().charAt(0)||'ط';
 const metrics=x=>{const m=x?.recitation_metrics||{},sum=k=>['memorization','recentReview','review'].reduce((n,q)=>n+Number(m?.[q]?.[k]||0),0);const e=sum('errors'),d=sum('doubts'),j=sum('tajweed');return e+d+j?('خطأ '+e+' · شك '+d+' · تجويد '+j):'—'};
 app.innerHTML=`
  <section class="hero">
   <div class="hero-brand"><img src="/assets/logo-sanabil-v6.png" alt="سنابل الوحي"><span>بوابة ولي الأمر</span></div>
   <div class="hero-student"><div class="avatar">${esc(initial)}</div><div><h1>${esc(d.student.fullName)}</h1><div class="hero-meta">${d.student.circleName?'<span class="chip">الحلقة: '+esc(d.student.circleName)+'</span>':''}${d.student.teacherName?'<span class="chip">المعلم: '+esc(d.student.teacherName)+'</span>':''}</div></div></div>
  </section>
  <div class="cards"><div class="card"><span>الحضور خلال الفترة</span><b>${attRate}%</b></div><div class="card"><span>إنجاز المسارات</span><b>${outcomeRate}%</b></div><div class="card"><span>آخر اختبار</span><b>${esc(latest)}</b></div><div class="card"><span>الخطط النشطة</span><b>${p.length}</b></div></div>

  <section class="panel"><div class="panel-head"><div><h2>المقرر القادم</h2><div class="panel-sub">ما ينبغي الاستعداد له في أقرب يوم تعليمي</div></div></div>
   ${next.length?'<div class="assignment-grid">'+next.map(x=>'<article class="assignment"><strong>'+esc(types[x.type]||x.type)+'</strong><div class="route">'+esc(qref(x.from)+' ← '+qref(x.to))+'</div><small>'+esc(x.date)+' · الكمية: '+esc(x.amount)+'</small></article>').join('')+'</div>':'<p class="muted">لا يوجد مقرر قادم مجدول حاليًا.</p>'}
  </section>

  ${an.length?'<section class="panel"><div class="panel-head"><h2>إعلانات الحلقة</h2></div>'+an.map(x=>'<article class="notice"><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p><small class="muted">'+esc(x.starts_on)+(x.ends_on?' — '+esc(x.ends_on):'')+'</small></article>').join('')+'</section>':''}

  <section class="panel"><div class="panel-head"><div><h2>الخطة التعليمية</h2><div class="panel-sub">المسارات النشطة للطالب</div></div></div>
   ${p.length?'<div class="plan-grid">'+p.map(x=>'<article class="plan-card"><strong>'+esc(types[x.type]||x.type)+'</strong><div>'+esc(x.daily_amount)+' '+esc({lines:'سطر',pages:'صفحة',ayahs:'آية'}[x.unit]||x.unit)+' يوميًا</div><small>'+esc(x.start_date)+' — '+esc(x.end_date)+'</small></article>').join('')+'</div>':'<p class="muted">لا توجد خطة نشطة حاليًا.</p>'}
  </section>

  <section class="panel"><div class="panel-head"><div><h2>الحصيلة الأخيرة</h2><div class="panel-sub">تفصيل الحفظ والمراجعة لكل يوم</div></div></div>
   ${o.length?'<div class="outcome-list">'+o.slice(0,10).map(x=>'<article class="outcome-item"><div class="outcome-top"><span class="outcome-date">'+esc(x.date_key)+'</span><span class="pill">'+esc(metrics(x))+'</span></div><div class="track-grid"><div class="track"><b>الحفظ الجديد</b><p>'+esc(x.new_lesson||'—')+'</p><span class="pill">'+esc(x.memorization_rating||'—')+'</span></div><div class="track"><b>المراجعة القريبة</b><p>'+esc(x.recent_review||'—')+'</p><span class="pill">'+esc(x.recent_review_rating||'—')+'</span></div><div class="track"><b>المراجعة الكبرى</b><p>'+esc(x.review||'—')+'</p><span class="pill">'+esc(x.review_rating||'—')+'</span></div></div></article>').join('')+'</div>':'<p class="muted">لا توجد حصيلة حديثة.</p>'}
  </section>

  <section class="panel"><div class="panel-head"><h2>الحضور</h2></div>${a.length?'<div class="scroll"><table class="table"><thead><tr><th>التاريخ</th><th>الحالة</th><th>ملاحظة</th></tr></thead><tbody>'+a.map(x=>'<tr><td>'+esc(x.date_key)+'</td><td><span class="pill">'+esc(attend[x.status]||x.status)+'</span></td><td>'+esc(x.note||'—')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="muted">لا توجد سجلات حضور حديثة.</p>'}</section>

  <section class="panel"><div class="panel-head"><div><h2>نتائج الاختبارات</h2><div class="panel-sub">آخر الاختبارات المسجلة</div></div></div>
   ${t.length?'<div class="test-grid">'+t.map(x=>{const total=Number(x.scores?.total||0);return '<article class="test-card"><strong>'+esc(x.syllabus_snapshot?.label||x.type||'اختبار')+'</strong><div>المجموع: <b>'+esc(x.scores?.total??'—')+'</b> / 100</div><small>'+date(x.performed_at)+' · '+esc(gradeScore(total))+'</small></article>'}).join('')+'</div>':'<p class="muted">لا توجد نتائج اختبارات بعد.</p>'}
  </section>

  ${aw.length?'<section class="panel"><div class="panel-head"><h2>التكريم والتحفيز</h2></div>'+aw.map(x=>'<article class="notice"><b>'+esc(x.title)+'</b><p>'+esc(x.note||'')+'</p><small class="muted">'+esc(x.awarded_on)+(x.category?' · '+esc(x.category):'')+'</small></article>').join('')+'</section>':''}
  <div class="footer-note">آخر تحديث: ${new Date(d.generatedAt).toLocaleString('ar-SA',{timeZone:'Asia/Riyadh'})}</div><a class="back" href="/">العودة إلى سنابل الوحي</a>`;
}).catch(e=>{app.innerHTML='<div class="error">'+esc(e.message)+'</div><a class="back" href="/">العودة إلى سنابل الوحي</a>'});
})();
</script>
</body></html>
