<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#006b74">
<title>بوابة ولي الأمر | سنابل الوحي</title>
<link rel="icon" href="/assets/logo-sanabil-icon-v6.png">
<link rel="stylesheet" href="/sanabil-identity.css?v=3"><style>
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
:root{--teal:#00808A;--teal2:#006b74;--gold:#D8BD88;--ink:#183c33;--muted:#667a72;--bg:#f4f7f5;--line:#dce7e2;--white:#fff;--danger:#a54545;--warn:#9a681d}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Alyamama,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(180deg,#e8f3ef 0,#fbf8f2 330px,#f4f7f5 100%);color:var(--ink)}
button,a{touch-action:manipulation}
.wrap{max-width:1080px;margin:auto;padding:18px 16px 42px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#082c27,#0e5848 72%,#8b6a2c);color:#fff;border-radius:28px;padding:22px;box-shadow:0 18px 44px #004d5530}
.hero:before,.hero:after{content:"";position:absolute;border:1px solid #ffffff22;border-radius:50%}.hero:before{width:250px;height:250px;left:-95px;top:-130px}.hero:after{width:150px;height:150px;left:85px;bottom:-110px}
.brandrow{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brandrow img{width:138px;max-width:38vw;background:#fff;border-radius:18px;padding:8px;box-shadow:0 8px 20px #003f4520}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:#ffffff16;border:1px solid #ffffff22;color:#fff5d8;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}
.hero-main{position:relative;z-index:1;margin-top:20px}
.guardian-title{display:block;width:min(430px,82vw);height:auto;max-height:112px;object-fit:contain;object-position:right center;margin:0 0 8px auto}.hero h1{font-family:Alyamama,Tahoma,sans-serif;font-size:clamp(25px,5vw,42px);margin:0 0 7px}.hero .student{font-size:clamp(20px,4vw,28px);font-weight:900}.hero p{margin:5px 0;color:#e7f4f2;line-height:1.65}
.hero-footer{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:17px}.hero-chip{background:#fff;color:var(--teal2);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;margin:14px 0}.metric{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:0 7px 22px #183c3310}.metric span{display:block;color:var(--muted);font-size:12px}.metric b{display:block;color:var(--teal2);font-size:28px;margin-top:5px}
.section{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 7px 22px #183c330c}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.section-head h2{font-family:Alyamama,Tahoma,sans-serif;font-size:20px;margin:0;color:#004a3a;font-weight:700}.section-head small{color:var(--muted)}
.next-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.next-card{border:1px solid #d8e7e2;border-radius:17px;padding:13px;background:linear-gradient(180deg,#fbfdfc,#f3f8f6)}.next-card .type{font-size:12px;color:var(--teal2);font-weight:900}.next-card strong{display:block;margin:7px 0 5px;line-height:1.55}.next-card small{color:var(--muted)}
.outcomes{display:grid;gap:9px}.outcome{border:1px solid #e2ebe7;border-radius:17px;padding:13px;background:#fcfdfc}.outcome-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}.outcome-head time{color:var(--muted);font-size:12px}.track{display:grid;grid-template-columns:112px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-top:1px dashed #e3ebe8}.track:first-of-type{border-top:0}.track>span:first-child{font-weight:800;color:#49665c;font-size:12px}.lesson{font-size:12px;line-height:1.6}.grade{display:inline-flex;border-radius:999px;padding:5px 8px;background:#eaf5f2;color:var(--teal2);font-size:11px;font-weight:900;white-space:nowrap}.grade.bad{background:#fff1ee;color:#9a443d}.grade.none{background:#f1f1ef;color:#777}
.att-list,.award-list,.announce-list,.test-list,.plan-list{display:grid;gap:8px}.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid #e5ece9;border-radius:15px;padding:11px 12px}.item-icon{width:38px;height:38px;border-radius:12px;background:#eaf5f2;color:var(--teal2);display:grid;place-items:center;font-weight:900}.item b{display:block;font-family:Alyamama,sans-serif;font-size:13px}.item small{color:var(--muted);line-height:1.5}.status{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;background:#eef6f4;color:var(--teal2)}.status.absent{background:#fff0ed;color:var(--danger)}.status.late{background:#fff6df;color:var(--warn)}
.announce{border-right:4px solid var(--gold);background:#fffcf5;border-radius:14px;padding:12px}.announce b{color:var(--teal2)}.announce p{margin:5px 0;line-height:1.7}.announce small{color:var(--muted)}
.empty{color:var(--muted);background:#f8faf9;border:1px dashed #cddbd5;border-radius:14px;padding:15px;text-align:center}
.footer{text-align:center;color:#788980;font-size:11px;padding:15px 0}.footer img{display:block;width:105px;margin:0 auto 8px;opacity:.9}
.error{background:#fff1f1;color:#8c2230;border:1px solid #e8bfc4;border-radius:18px;padding:18px}.back{display:inline-flex;margin-top:13px;color:var(--teal2);font-weight:800;text-decoration:none}.loading{text-align:center;padding:90px 20px;font-size:18px;color:var(--teal2)}
@media(max-width:760px){
 .wrap{padding:10px 9px 28px}.hero{border-radius:22px;padding:16px}.brandrow img{width:112px}.hero-main{margin-top:15px}
 .metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.metric{border-radius:16px;padding:12px}.metric b{font-size:24px}
 .section{border-radius:18px;padding:13px}.next-grid{grid-template-columns:1fr}.track{grid-template-columns:1fr auto}.track>span:first-child{grid-column:1/-1}.lesson{font-size:13px}
 .item{grid-template-columns:auto 1fr}.item>.status{grid-column:2;justify-self:start}
}
@media(max-width:390px){.brandrow{align-items:flex-start}.brandrow img{width:98px}.hero-badge{font-size:10px}.metrics{grid-template-columns:1fr 1fr}.metric span{font-size:11px}}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="loading">جارٍ فتح بوابة ولي الأمر…</div></div>
<script>
(()=>{'use strict';
const API='https://fvzoogbdezueswyihxiz.supabase.co/functions/v1/sanabil-guardian',app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=x=>x?new Date(x).toLocaleDateString('ar-SA',{timeZone:'Asia/Riyadh'}):'—';
const attend={present:'حاضر',late:'متأخر',excused:'مستأذن',absent:'غائب'};
const types={memorization:'الحفظ الجديد',recent_review:'المراجعة الصغرى',review:'المراجعة الكبرى'};
const units={lines:'سطر',pages:'صفحة',ayahs:'آية',surahs:'سورة'};
const directions={toward_nas:'نحو الناس',toward_fatiha:'نحو الفاتحة'};
const qref=r=>r?((r.surahName||r.surah||'سورة')+' '+(r.ayahNo||r.ayah||'')):'—';
const segText=x=>Array.isArray(x?.segments)&&x.segments.length?x.segments.map(s=>'سورة '+(s.surahName||s.from?.surahName||'')+': '+(s.from?.ayahNo||s.from?.ayah||'')+'–'+(s.to?.ayahNo||s.to?.ayah||'')).join('، ثم '):(qref(x?.from)+' ← '+qref(x?.to));
const gradeCls=g=>['لم يحفظ','لم يسمع'].includes(g)?'bad':!g?'none':'';
const code=new URLSearchParams(location.search).get('code')||'';
if(!/^[A-Fa-f0-9]{32}$/.test(code)){app.innerHTML='<div class="error">رابط ولي الأمر غير مكتمل أو غير صالح.</div><a class="back" href="/">العودة إلى سنابل الوحي</a>';return}
fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})})
.then(async r=>{const j=await r.json().catch(()=>({error:'تعذر قراءة الاستجابة.'}));if(!r.ok||j.error)throw Error(j.error||'تعذر فتح البوابة.');return j})
.then(d=>{
 const a=d.attendance||[],o=d.outcomes||[],t=d.tests||[],p=d.plans||[],next=d.nextAssignments||[],aw=d.awards||[],an=d.announcements||[];
 const present=a.filter(x=>x.status==='present'||x.status==='late').length,attRate=a.length?Math.round(present/a.length*100):0;
 const ratings=x=>[x.memorization_rating,x.recent_review_rating,...(Array.isArray(x.recitation_metrics?.reviewPlans)&&x.recitation_metrics.reviewPlans.length?x.recitation_metrics.reviewPlans.map(r=>r.rating||r.grade):[x.review_rating])].filter(Boolean),all=o.flatMap(ratings),outRate=all.length?Math.round(all.filter(x=>['ممتاز','جيد جدًا','جيد'].includes(x)).length/all.length*100):0;
 const testScores=t.filter(x=>x.scores?.total!=null).map(x=>Number(x.scores.total)).filter(Number.isFinite),avg=testScores.length?Math.round(testScores.reduce((x,y)=>x+y,0)/testScores.length*10)/10:'—';
 const latestAtt=a[0],todayNext=next[0]?.date||'—';
 const metrics=x=>{const m=x?.recitation_metrics||{},sum=k=>['memorization','recentReview','review'].reduce((n,q)=>n+Number(m?.[q]?.[k]||0),0),e=sum('errors'),s=sum('doubts'),j=sum('tajweed');return e+s+j?('خطأ '+e+' · شك '+s+' · تجويد '+j):''};
 const outcomeHtml=o.slice(0,12).map(x=>'<article class="outcome"><div class="outcome-head"><b>حصيلة اليوم</b><time>'+esc(x.date_key)+'</time></div>'+
   [['الحفظ الجديد',x.new_lesson,x.memorization_rating],['المراجعة الصغرى',x.recent_review,x.recent_review_rating],['المراجعة الكبرى',x.review,x.review_rating]].map(r=>'<div class="track"><span>'+r[0]+'</span><span class="lesson">'+esc(r[1]||'—')+'</span><span class="grade '+gradeCls(r[2])+'">'+esc(r[2]||'—')+'</span></div>').join('')+
   (metrics(x)?'<small style="display:block;margin-top:8px;color:#667a72">'+esc(metrics(x))+'</small>':'')+'</article>').join('');
 const nextHtml=next.map(x=>'<article class="next-card"><span class="type">'+esc(x.planName||types[x.type]||x.type)+'</span><strong>'+esc(segText(x))+'</strong><small>'+esc(x.date)+' · '+esc(x.amount)+' '+esc(units[x.unit]||'وحدة')+' · '+esc(directions[x.direction]||'')+(Number(x.cycleNo||1)>1?' · الدورة '+esc(x.cycleNo):'')+'</small></article>').join('');
 const attHtml=a.slice(0,14).map(x=>'<div class="item"><span class="item-icon">✓</span><div><b>'+esc(x.date_key)+'</b><small>'+esc(x.note||'بدون ملاحظة')+'</small></div><span class="status '+esc(x.status)+'">'+esc(attend[x.status]||x.status)+'</span></div>').join('');
 const testsHtml=t.slice(0,8).map(x=>'<div class="item"><span class="item-icon">ق</span><div><b>'+esc(x.syllabus_snapshot?.label||x.type||'اختبار قرآن')+'</b><small>'+esc(date(x.performed_at))+'</small></div><span class="status">'+esc(x.scores?.total??'—')+'/100</span></div>').join('');
 const plansHtml=p.map(x=>'<div class="item"><span class="item-icon">خ</span><div><b>'+esc(x.name||types[x.type]||x.type)+'</b><small>'+esc(x.daily_amount)+' '+esc(units[x.unit]||x.unit)+' يوميًا · '+esc(directions[x.direction]||'')+' · '+esc(x.start_date)+' — '+esc(x.end_date)+(x.range_end_surah?' · حد الالتقاء عند السورة '+esc(x.range_end_surah):'')+(x.cycle_enabled?' · دورية تلقائيًا':'')+'</small></div><span class="status">نشطة</span></div>').join('');
 const awardsHtml=aw.slice(0,10).map(x=>'<div class="item"><span class="item-icon">★</span><div><b>'+esc(x.title)+'</b><small>'+esc(x.awarded_on)+(x.note?' · '+esc(x.note):'')+'</small></div><span class="status">'+esc(x.category||'تكريم')+'</span></div>').join('');
 app.innerHTML='<section class="hero"><div class="brandrow"><img src="/assets/logo-sanabil-v6.png" alt="سنابل الوحي"><span class="hero-badge">متابعة الأسرة · سنابل الوحي</span></div><div class="hero-main"><img class="guardian-title" src="/assets/guardian-title-doran.png" alt="بوابة ولي الأمر"><div class="student">'+esc(d.student.fullName)+'</div><p>'+esc(d.student.circleName||'')+(d.student.teacherName?' · المعلم: '+esc(d.student.teacherName):'')+'</p></div><div class="hero-footer"><span class="hero-chip">'+(latestAtt?'آخر حضور: '+esc(attend[latestAtt.status]||latestAtt.status):'لا يوجد حضور حديث')+'</span><span class="hero-chip">المقرر القادم: '+esc(todayNext)+'</span></div></section>'+
 '<section class="metrics" aria-label="ملخص السجلات المتاحة"><article class="metric"><span>الحضور</span><b>'+(a.length?attRate+'%':'—')+'</b></article><article class="metric"><span>التقديرات المجتازة</span><b>'+(all.length?outRate+'%':'—')+'</b></article><article class="metric"><span>متوسط الاختبارات</span><b>'+esc(avg)+'</b></article><article class="metric"><span>الخطط النشطة</span><b>'+p.length+'</b></article></section>'+
 (an.length?'<section class="section"><div class="section-head"><h2>إعلانات الحلقة</h2></div><div class="announce-list">'+an.map(x=>'<article class="announce"><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p><small>'+esc(x.starts_on)+(x.ends_on?' — '+esc(x.ends_on):'')+'</small></article>').join('')+'</div></section>':'')+
 '<section class="section"><div class="section-head"><h2>المقرر القادم</h2><small>للاستعداد قبل الحلقة</small></div>'+(nextHtml?'<div class="next-grid">'+nextHtml+'</div>':'<div class="empty">لا يوجد مقرر قادم مجدول حاليًا.</div>')+'</section>'+
 '<section class="section"><div class="section-head"><h2>آخر الحصائل</h2><small>الحفظ والمراجعات بتقدير مستقل</small></div>'+(outcomeHtml?'<div class="outcomes">'+outcomeHtml+'</div>':'<div class="empty">لا توجد حصيلة حديثة.</div>')+'</section>'+
 '<section class="section"><div class="section-head"><h2>الحضور</h2></div>'+(attHtml?'<div class="att-list">'+attHtml+'</div>':'<div class="empty">لا توجد سجلات حضور حديثة.</div>')+'</section>'+
 '<section class="section"><div class="section-head"><h2>الاختبارات</h2></div>'+(testsHtml?'<div class="test-list">'+testsHtml+'</div>':'<div class="empty">لا توجد اختبارات حتى الآن.</div>')+'</section>'+
 '<section class="section"><div class="section-head"><h2>الخطة التعليمية</h2></div>'+(plansHtml?'<div class="plan-list">'+plansHtml+'</div>':'<div class="empty">لا توجد خطة نشطة حاليًا.</div>')+'</section>'+
 (awardsHtml?'<section class="section"><div class="section-head"><h2>التكريم والإنجاز</h2></div><div class="award-list">'+awardsHtml+'</div></section>':'')+
 '<p class="footer">نسبة الحضور من السجلات المدخلة خلال آخر 60 يومًا، ونسبة التقديرات المجتازة من المسارات المرصودة. آخر تحديث: '+esc(new Date(d.generatedAt).toLocaleString('ar-SA',{timeZone:'Asia/Riyadh'}))+'</p><footer class="footer"><img src="/assets/logo-sanabil-v6.png" alt=""><div>متابعة تعليمية موثوقة بين الحلقة والأسرة</div><div>سنابل الوحي · إصدار ولي الأمر V11 · 2026.09.30</div></footer>';
}).catch(e=>{app.innerHTML='<div class="error">'+esc(e.message)+'</div><a class="back" href="/">العودة إلى سنابل الوحي</a>'});
})();
</script>
</body>
</html>
