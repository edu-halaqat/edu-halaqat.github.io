 const p1=Number(x?.from?.pageNo||x?.from?.page||0),p2=Number(x?.to?.pageNo||x?.to?.page||p1||0),pages=[];if(p1&&p2)for(let p=Math.min(p1,p2);p<=Math.max(p1,p2)&&pages.length<8;p++)pages.push(p);
 const pad=n=>String(n).padStart(3,'0'),CDN='https://cdn.quran.ws/svg/pages/v1.1.1/hafs-kfqc/';

     '<div class="empty">سيظهر المؤشر عند اعتماد أول حصيلة حفظ مجتازة.</div></section>';

 (score.month?'<section class="section guardian-scores"><div class="section-head"><h2>رصيد الطالب وترتيبه</h2><small>من الحصائل والحضور المعتمدين فقط</small></div>'+
 '<div class="score-grid">'+scoreCard('نقاط اليوم',score.today?.total??0)+scoreCard('إجمالي هذا الشهر',score.month.total)+
 scoreCard('رصيد الفترة',score.period?.total??0)+rankCard('ترتيبه في الحلقة',score.period?.circleRank,score.period?.circleCount)+
 rankCard('ترتيبه في المجمع',score.period?.complexRank,score.period?.complexCount)+'</div>'+
 '<p class="score-period">'+esc(score.cycle?.name||'الفترة الحالية')+' · '+
 (score.cycle?.status==='scheduled'?'لم يبدأ احتساب النقاط بعد':('النقاط المحتسبة من '+esc(score.period?.from||score.month.from)+' إلى '+esc(score.period?.to||score.month.to)))+
 (score.cycle?.end?' · نهاية الدورة: '+esc(score.cycle.end):'')+
 (score.cycle?.schedule?' · التصفير القادم: '+esc(score.cycle.schedule.nextStart):'')+'</p>'+
 '<div class="score-table-wrap"><table><thead><tr><th>التاريخ</th><th>الحضور</th><th>الحفظ</th><th>جنب الدرس</th><th>الكبرى</th><th>المجموع</th></tr></thead><tbody>'+
 (score.month.daily||[]).slice(0,31).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+formatScore(x.attendance)+'</td>'+
 '<td>'+formatScore(x.memorization)+'</td><td>'+formatScore(x.recentReview)+'</td><td>'+formatScore(x.majorReview)+'</td><td><b>'+formatScore(x.total)+'</b></td></tr>').join('')+
 '</tbody></table></div><p class="score-period">لا تظهر أسماء الطلاب الآخرين؛ رصيد المسودات غير المعتمدة لا يُحتسب.</p></section>':'');

 honorHtml+scoreHtml+

 familySections+
 (an.length?'<section class="section"><div class="section-head"><h2>إعلانات الحلقة</h2></div><div class="announce-list">'+an.map(x=>'<article class="announce"><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p><small>'+esc(x.starts_on)+(x.ends_on?' — '+esc(x.ends_on):'')+'</small></article>').join('')+'</div></section>':'')+
 (preparationHtml?'<section class="section"><div class="section-head"><h2>الاستعداد لدرس الغد</h2><small>معاينة الدرس والاستماع قبل الحلقة</small></div>'+preparationHtml+'</section>':'')+
 '<section class="section"><div class="section-head"><h2>المقرر القادم</h2><small>للاستعداد قبل الحلقة</small></div>'+(nextHtml?'<div class="next-grid">'+nextHtml+'</div>':'<div class="empty">لا يوجد مقرر قادم مجدول حاليًا.</div>')+'</section>'+
 (d.student.circleType==='حلقات التلقين'?'<section class="section"><div class="section-head"><h2>حصائل نور البيان</h2><small>سجل الدروس والتقديرات المصححة</small></div>'+(talaqqinHistoryHtml?'<div class="outcomes">'+talaqqinHistoryHtml+'</div>':'<div class="empty">لم تُرصد حصائل دروس حتى الآن.</div>')+'</section>':'<section class="section"><div class="section-head"><h2>آخر الحصائل</h2><small>الحفظ والمراجعات بتقدير مستقل</small></div>'+(outcomeHtml?'<div class="outcomes">'+outcomeHtml+'</div>':'<div class="empty">لا توجد حصيلة حديثة.</div>')+'</section>')+
 '<section class="section"><div class="section-head"><h2>الحضور</h2></div>'+(attHtml?'<div class="att-list">'+attHtml+'</div>':'<div class="empty">لا توجد سجلات حضور حديثة.</div>')+'</section>'+
 '<section class="section"><div class="section-head"><h2>الاختبارات</h2></div>'+(testsHtml?'<div class="test-list">'+testsHtml+'</div>':'<div class="empty">لا توجد اختبارات حتى الآن.</div>')+'</section>'+
 '<section class="section"><div class="section-head"><h2>الخطة التعليمية</h2></div>'+(plansHtml?'<div class="plan-list">'+plansHtml+'</div>':'<div class="empty">لا توجد خطة نشطة حاليًا.</div>')+'</section>'+
 (awardsHtml?'<section class="section"><div class="section-head"><h2>التكريم والإنجاز</h2></div><div class="award-list">'+awardsHtml+'</div></section>':'')+
 '<p class="footer">نسبة الحضور من السجلات المدخلة خلال آخر 60 يومًا، ونسبة التقديرات المجتازة من المسارات المرصودة. آخر تحديث: '+esc(new Date(d.generatedAt).toLocaleString('ar-SA',{timeZone:'Asia/Riyadh'}))+'</p><footer class="footer"><img src="/assets/logo-sanabil-v6.png" alt=""><div>متابعة تعليمية موثوقة بين الحلقة والأسرة</div><div>سنابل الوحي · إصدار ولي الأمر V13.4.1 · 2026.10.19</div></footer>';
 app.insertAdjacentHTML('beforeend',familyMonthlyReport(d,a));
 bindFamilyActions(d,a);
 const tp=app.querySelector('[data-talaqqin-preview]');if(tp&&talaqqinLesson)tp.onclick=()=>window.open('/noor-bayan.html?page='+encodeURIComponent(talaqqinLesson.pageFrom)+(talaqqinLesson.pageTo!==talaqqinLesson.pageFrom?'&to='+encodeURIComponent(talaqqinLesson.pageTo):'')+'&title='+encodeURIComponent(talaqqinLesson.title),'_blank','noopener,noreferrer');
 const tm=app.querySelector('[data-talaqqin-media]');if(tm&&talaqqinLesson)tm.onclick=()=>openTalaqqinMedia(talaqqinLesson);
 app.querySelectorAll('[data-husary]').forEach(b=>{b.onclick=()=>openHusary(quranPrep[Number(b.dataset.husary)])});
}).catch(e=>{app.innerHTML='<div class="error">'+esc(e.message)+'</div><a class="back" href="/">العودة إلى سنابل الوحي</a>'});
})();
