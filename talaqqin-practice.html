<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدريب نور البيان | سنابل الوحي</title><meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="/assets/logo-sanabil-icon-v6.png">
<style>
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{--deep:#073c34;--teal:#00808a;--gold:#d8bd88;--cream:#f8f5ee;--line:#dce7e2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--deep);font-family:Alyamama,Tahoma,sans-serif}
header{background:#fff;border-bottom:1px solid #eadfc9;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}header img{width:135px}
main{max-width:850px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#073c34,#0b6a56);color:#fff;border-radius:22px;padding:20px}.hero b{color:var(--gold)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px;text-align:center}.prompt{font-size:clamp(48px,10vw,88px);font-weight:700;line-height:1.5;min-height:150px;display:grid;place-items:center}.hint{color:#64776f;line-height:1.8}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #cfe0d9;border-radius:13px;background:#eaf5f2;color:var(--deep);padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.primary{background:var(--deep);color:#fff}.progress{height:10px;background:#edf2ef;border-radius:99px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:var(--gold);width:0}.small{font-size:13px;color:#687a73}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}.choice{border:1px solid #d9e5e0;background:#fff;border-radius:14px;padding:14px;font:inherit;font-size:25px;cursor:pointer}.choice.ok{background:#e7f6ef;border-color:#9bcbb9}.choice.bad{background:#fff0ed;border-color:#e2b0a8}
</style></head>
<body>
<header><img src="/assets/logo-sanabil-v6.png" alt="سنابل الوحي"><a class="btn" href="/" rel="noopener">العودة للمنصة</a></header>
<main>
<section class="hero"><b>حلقات التلقين · نور البيان</b><h1 id="title">تدريب تفاعلي</h1><p>تدريب مساعد قصير بلا موسيقى: استمع، كرر، ثم انتقل إلى البطاقة التالية. المرجع المعتمد هو صفحة نور البيان المحددة للدرس.</p></section>
<section class="card">
<div class="progress"><span id="bar"></span></div>
<div class="prompt" id="prompt"></div>
<p class="hint" id="hint"></p>
<div class="actions"><button class="btn primary" id="speak">استمع للحرف</button><button class="btn" id="lessonExplain">استمع لشرح الدرس</button><button class="btn" id="again">كرر</button><button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button><a class="btn" id="book">صفحة نور البيان</a></div>
<div id="humanAudio" hidden style="margin-top:18px;text-align:right">
  <div class="small" id="audioNote" style="margin-bottom:8px"></div>
  <div id="directAudioBox" hidden style="border:1px solid #d9e5e0;border-radius:16px;background:#f7fbf9;padding:16px;text-align:center">
    <div style="font-size:42px;line-height:1;margin-bottom:10px">🔊</div>
    <audio id="directAudio" preload="none"></audio>
  </div>
  <div id="lessonVideoBox" style="position:relative;padding-top:56.25%;border-radius:16px;overflow:hidden;background:#0b1715">
    <iframe id="lessonPlayer" title="المصدر الصوتي للدرس" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
  </div>
  <div class="actions" style="justify-content:flex-start"><a class="btn" id="sourceLink" target="_blank" rel="noopener noreferrer">فتح المصدر الأصلي</a></div>
</div>
<div class="choices" id="choices"></div>
<p class="small" id="audioStatus"></p>
</section>
</main>
<script>
(()=>{'use strict';
 const p=new URLSearchParams(location.search),lesson=Number(p.get('lesson')||1),unit=Number(p.get('unit')||1),title=p.get('title')||'تدريب نور البيان',page=Number(p.get('page')||3);
 document.getElementById('title').textContent=title;document.getElementById('book').href='/noor-bayan.html?page='+page+'&title='+encodeURIComponent(title);
 const letters={1:['أ','ب','ت','ث'],2:['ج','ح','خ','د'],3:['ذ','ر','ز','س'],4:['ش','ص','ض','ط'],5:['ظ','ع','غ','ف'],6:['ق','ك','ل','م'],7:['ن','هـ','و','ي']};
 const lessonMap={
  8:['أَ','بَ','تَ','ثَ','جَ','حَ','خَ'],9:['دَ','ذَ','رَ','زَ','سَ','شَ','صَ'],10:['ضَ','طَ','ظَ','عَ','غَ','فَ','قَ'],11:['كَ','لَ','مَ','نَ','هَ','وَ','يَ'],
  12:['كَتَبَ','ذَهَبَ','فَتَحَ','جَلَسَ'],13:['فَتَحَ بَابًا','ذَهَبَ وَلَدٌ','كَتَبَ دَرْسًا'],14:['ذَهَبَ وَلَدٌ مُبَكِّرًا','فَتَحَ أَحْمَدُ بَابًا'],
  15:['بِ','تِ','ثِ','جِ','حِ','خِ'],16:['بِسْمِ اللهِ','فِي بَيْتٍ','مِنْ كِتَابٍ'],17:['بِسْمِ اللهِ نَبْدَأُ','فِي بَيْتٍ كَبِيرٍ'],
  18:['بُ','تُ','ثُ','جُ','حُ','خُ'],19:['نُورٌ مُبِينٌ','كُتُبٌ جَدِيدَةٌ'],20:['هُوَ رَسُولٌ كَرِيمٌ'],
  21:['بَا','تَا','ثَا','نَا'],22:['بِي','تِي','فِي','لِي'],23:['هٰذِهِ','فِيهِ'],24:['بُو','تُو','نُو','هُو'],25:['دَاوُدُ','هُوَ'],
  26:['أَبْ','أَتْ','مِنْ','لَمْ','هَلْ'],27:['كِتَابًا','عِلْمًا','نُورًا'],28:['كِتَابٍ','عِلْمٍ','نُورٍ'],29:['كِتَابٌ','عِلْمٌ','نُورٌ'],
  30:['رَبَّ','إِنَّ','ثُمَّ'],31:['حَقًّا','رَبًّا'],32:['حَقٍّ','رَبٍّ'],33:['حَقٌّ','رَبٌّ'],34:['اقْرَأْ بِتَأَنٍّ','رَاعِ الحَرَكَاتِ وَالمَدَّ وَالسُّكُونَ']
 };
 const items=unit===1?(letters[lesson]||letters[1]):(lessonMap[lesson]||[title]),prompt=document.getElementById('prompt'),hint=document.getElementById('hint'),bar=document.getElementById('bar');let i=0;
 const isFathaLesson=unit===2&&lesson>=8&&lesson<=11;
 const letterNames={'أَ':'همزة','بَ':'باء','تَ':'تاء','ثَ':'ثاء','جَ':'جيم','حَ':'حاء','خَ':'خاء','دَ':'دال','ذَ':'ذال','رَ':'راء','زَ':'زاي','سَ':'سين','شَ':'شين','صَ':'صاد','ضَ':'ضاد','طَ':'طاء','ظَ':'ظاء','عَ':'عين','غَ':'غين','فَ':'فاء','قَ':'قاف','كَ':'كاف','لَ':'لام','مَ':'ميم','نَ':'نون','هَ':'هاء','وَ':'واو','يَ':'ياء'};
 const fathaFileIndex={'أَ':'06','بَ':'05','تَ':'04','ثَ':'03','جَ':'02','حَ':'01','خَ':'12','دَ':'11','ذَ':'10','رَ':'09','زَ':'08','سَ':'07','شَ':'18','صَ':'17','ضَ':'16','طَ':'15','ظَ':'14','عَ':'13','غَ':'24','فَ':'23','قَ':'22','كَ':'21','لَ':'20','مَ':'19','نَ':'30','هَ':'29','وَ':'28','يَ':'27'};
 const fathaAudioOf=x=>fathaFileIndex[x]?'https://eduquran.com/wp-content/uploads/erol/voices/S0801_'+fathaFileIndex[x]+'.mp3':'';

 const sources=[  {match:()=>unit===2&&lesson>=12&&lesson<=14,video:'Ylkyb2QsecE',label:'دورة نور البيان — قراءة كلمات مع حركة الفتح — أكاديمية أسماء للقرآن',segmentMode:'ordered',intro:14,step:11,clip:10},
  {match:()=>unit===2&&lesson>=15&&lesson<=17,video:'DByJNWqq0uc',label:'منهج نور البيان — حركة الكسر — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&lesson>=18&&lesson<=20,video:'wQSz4wE5-mM',label:'منهج نور البيان — حركة الضم — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&lesson===21,video:'V0gxPwiMjgQ',label:'منهج نور البيان — المد بالألف — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&(lesson===22||lesson===23),video:'9YhIJqMyPjs',label:'منهج نور البيان — المد بالياء — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&(lesson===24||lesson===25),video:'6CD_BbO7kFE',label:'منهج نور البيان — المد بالواو — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&lesson===26,video:'MkyE_7EY6IU',label:'منهج نور البيان — حروف الهجاء مع السكون — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&lesson===27,video:'octVnyKWA_E',label:'منهج نور البيان — تنوين الفتح — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&lesson===28,video:'k7qEGJay5zs',label:'منهج نور البيان — تنوين الكسر — نور البيان Nour Al-bayan'},
  {match:()=>unit===2&&lesson>=30&&lesson<=34,video:'YNTTVo-IUqY',label:'منهج نور البيان — الشدة — نور البيان Nour Al-bayan'},
  {match:()=>/ضم/.test(title)&&/كلمات|قراءة/.test(title),video:'eaEnxx0Aes4',label:'نور البيان — كلمات مع حركة الضم — قناة القراءة والكتابة من الصفر'}
 ];
 const noorFathaLesson={video:'aWwYLqPmoKs',label:'دورة نور البيان — الحروف مع حركة الفتح — أكاديمية أسماء للقرآن'};
 const noorFathaGroups={
   8:{start:44,end:82},
   9:{start:82,end:116},
   10:{start:116,end:146},
   11:{start:146,end:173}
 };
 const source=sources.find(x=>x.match())||null;
 const humanAudio=document.getElementById('humanAudio'),player=document.getElementById('lessonPlayer'),audioNote=document.getElementById('audioNote'),sourceLink=document.getElementById('sourceLink'),directAudio=document.getElementById('directAudio'),directAudioBox=document.getElementById('directAudioBox'),lessonVideoBox=document.getElementById('lessonVideoBox'),audioStatus=document.getElementById('audioStatus');
 const render=()=>{prompt.textContent=items[i];hint.textContent=isFathaLesson?('🔊  × 3   •   '+(i+1)+' / '+items.length):('استمع ثم كرر ثلاث مرات. البطاقة '+(i+1)+' من '+items.length+'.');bar.style.width=((i+1)/items.length*100)+'%';document.getElementById('choices').innerHTML='';document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===items.length-1};
 const playDirectFatha=async()=>{
   const target=items[i],src=fathaAudioOf(target);
   if(!src)throw Error('لم يُعتمد ملف صوت لهذا الحرف بعد.');
   humanAudio.hidden=false;directAudioBox.hidden=false;lessonVideoBox.hidden=true;sourceLink.hidden=false;
   audioNote.textContent='';audioStatus.textContent='';
   sourceLink.href='https://eduquran.com/ar/%D8%A7%D9%84%D9%81%D8%AA%D8%AD%D8%A9/';
   player.src='about:blank';
   directAudio.pause();directAudio.currentTime=0;directAudio.onerror=null;directAudio.src=src;
   await directAudio.play();
   humanAudio.scrollIntoView({behavior:'smooth',block:'nearest'});
 };
 const playNoorExplanation=()=>{
   if(!isFathaLesson)return playHuman(true);
   const clip=noorFathaGroups[lesson]||noorFathaGroups[8];
   directAudio.pause();directAudioBox.hidden=true;lessonVideoBox.hidden=false;humanAudio.hidden=false;sourceLink.hidden=false;
   audioNote.textContent='';audioStatus.textContent='';
   sourceLink.href='https://www.youtube.com/watch?v='+noorFathaLesson.video+'&t='+clip.start+'s';
   const url='https://www.youtube-nocookie.com/embed/'+noorFathaLesson.video+'?autoplay=1&playsinline=1&rel=0&modestbranding=1&start='+clip.start+'&end='+clip.end;
   player.src='about:blank';setTimeout(()=>{player.src=url},40);
   humanAudio.scrollIntoView({behavior:'smooth',block:'nearest'});
 };
 const playHuman=restart=>{
   directAudio.pause();directAudioBox.hidden=true;lessonVideoBox.hidden=false;humanAudio.hidden=false;
   if(!source){
     audioNote.textContent='لم يُعتمد لهذا الدرس تسجيل بشري محدد بعد. استخدم صفحة نور البيان مؤقتًا حتى يُربط التسجيل الموثوق.';
     player.removeAttribute('src');sourceLink.hidden=true;return;
   }
   sourceLink.hidden=false;
   audioNote.textContent='المصدر الصوتي: '+source.label+' — تشغيل شرح الدرس.';
   sourceLink.href='https://www.youtube.com/watch?v='+source.video;
   const url='https://www.youtube-nocookie.com/embed/'+source.video+'?autoplay=1&playsinline=1&rel=0&modestbranding=1';
   if(restart||!player.src.includes(source.video)){player.src='about:blank';setTimeout(()=>{player.src=url},40)}
   humanAudio.scrollIntoView({behavior:'smooth',block:'nearest'});
 };
 if(isFathaLesson){document.getElementById('speak').textContent='استمع للحرف';document.getElementById('again').textContent='كرر الحرف'}
 document.getElementById('speak').onclick=()=>isFathaLesson?playDirectFatha():playHuman(false);
 document.getElementById('lessonExplain').onclick=()=>playNoorExplanation();
 document.getElementById('again').onclick=()=>isFathaLesson?playDirectFatha():playHuman(true);
 document.getElementById('prev').onclick=()=>{if(i>0){i--;render();if(isFathaLesson&&!directAudioBox.hidden)playDirectFatha();else if(!isFathaLesson&&!humanAudio.hidden)playHuman(true)}};
 document.getElementById('next').onclick=()=>{if(i<items.length-1){i++;render();if(isFathaLesson&&!directAudioBox.hidden)playDirectFatha();else if(!isFathaLesson&&!humanAudio.hidden)playHuman(true)}};
 render();
})();
</script></body></html>
