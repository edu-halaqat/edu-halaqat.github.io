<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تدريب نور البيان | سنابل الوحي</title><meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="/assets/logo-sanabil-icon-v6.png">
<style>
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Regular.ttf') format('truetype');font-display:swap}
@font-face{font-family:Alyamama;src:url('/assets/fonts/Alyamama-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
:root{--deep:#073c34;--teal:#00808a;--gold:#d8bd88;--cream:#f8f5ee;--line:#dce7e2}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--deep);font-family:Alyamama,Tahoma,sans-serif}
header{background:#fff;border-bottom:1px solid #eadfc9;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}header img{width:135px}
main{max-width:850px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#073c34,#0b6a56);color:#fff;border-radius:22px;padding:20px}.hero b{color:var(--gold)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;margin-top:14px;text-align:center}.prompt{font-size:clamp(48px,10vw,88px);font-weight:700;line-height:1.5;min-height:150px;display:grid;place-items:center}.hint{color:#64776f;line-height:1.8}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.btn{border:1px solid #cfe0d9;border-radius:13px;background:#eaf5f2;color:var(--deep);padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}.btn.primary{background:var(--deep);color:#fff}.progress{height:10px;background:#edf2ef;border-radius:99px;overflow:hidden;margin:18px 0}.progress span{display:block;height:100%;background:var(--gold);width:0}.small{font-size:13px;color:#687a73}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:16px}.choice{border:1px solid #d9e5e0;background:#fff;border-radius:14px;padding:14px;font:inherit;font-size:25px;cursor:pointer}.choice.ok{background:#e7f6ef;border-color:#9bcbb9}.choice.bad{background:#fff0ed;border-color:#e2b0a8}
</style></head>
<body>
<header><img src="/assets/logo-sanabil-v6.png" alt="سنابل الوحي"><a class="btn" href="/" rel="noopener">العودة للمنصة</a></header>
<main>
<section class="hero"><b>حلقات التلقين · نور البيان</b><h1 id="title">تدريب تفاعلي</h1><p>تدريب مساعد قصير بلا موسيقى: استمع، كرر، ثم انتقل إلى البطاقة التالية. المرجع المعتمد هو صفحة نور البيان المحددة للدرس.</p></section>
<section class="card">
<div class="progress"><span id="bar"></span></div>
<div class="prompt" id="prompt"></div>
<p class="hint" id="hint"></p>
<div class="actions"><button class="btn primary" id="speak">🔊 تلقين المعلم</button><button class="btn" id="lessonExplain">▶ الدرس كاملاً</button><button class="btn" id="again">↻ كرر</button><button class="btn" id="prev">السابق</button><button class="btn" id="next">التالي</button><a class="btn" id="book">صفحة نور البيان</a></div>
<div id="humanAudio" hidden style="margin-top:18px;text-align:right">
  <div class="small" id="audioNote" style="margin-bottom:8px"></div>
  <div id="directAudioBox" hidden style="border:1px solid #d9e5e0;border-radius:16px;background:#f7fbf9;padding:16px;text-align:center">
    <div style="font-size:42px;line-height:1;margin-bottom:10px">🔊</div>
    <audio id="directAudio" preload="none"></audio>
  </div>
  <div id="lessonVideoBox" hidden></div>
  <div class="actions" style="justify-content:flex-start"><a class="btn" id="sourceLink" target="_blank" rel="noopener noreferrer">فتح المصدر الأصلي</a></div>
</div>
<div class="choices" id="choices"></div>
<p class="small" id="audioStatus" aria-live="polite"></p>
</section>
</main>
<script>
(()=>{'use strict';
 const p=new URLSearchParams(location.search),lesson=Number(p.get('lesson')||1),unit=Number(p.get('unit')||1),title=p.get('title')||'تدريب نور البيان',page=Number(p.get('page')||3);
 document.getElementById('title').textContent=title;document.getElementById('book').href='/noor-bayan.html?page='+page+'&title='+encodeURIComponent(title);
 const letters={1:['أ','ب','ت','ث'],2:['ج','ح','خ','د'],3:['ذ','ر','ز','س'],4:['ش','ص','ض','ط'],5:['ظ','ع','غ','ف'],6:['ق','ك','ل','م'],7:['ن','هـ','و','ي']};
 const lessonMap={
  8:['أَ','بَ','تَ','ثَ','جَ','حَ','خَ'],9:['دَ','ذَ','رَ','زَ','سَ','شَ','صَ'],10:['ضَ','طَ','ظَ','عَ','غَ','فَ','قَ'],11:['كَ','لَ','مَ','نَ','هَ','وَ','يَ'],
  12:['كَتَبَ','ذَهَبَ','فَتَحَ','جَلَسَ'],13:['فَتَحَ بَابًا','ذَهَبَ وَلَدٌ','كَتَبَ دَرْسًا'],14:['ذَهَبَ وَلَدٌ مُبَكِّرًا','فَتَحَ أَحْمَدُ بَابًا'],
  15:['بِ','تِ','ثِ','جِ','حِ','خِ'],16:['بِسْمِ اللهِ','فِي بَيْتٍ','مِنْ كِتَابٍ'],17:['بِسْمِ اللهِ نَبْدَأُ','فِي بَيْتٍ كَبِيرٍ'],
  18:['بُ','تُ','ثُ','جُ','حُ','خُ'],19:['نُورٌ مُبِينٌ','كُتُبٌ جَدِيدَةٌ'],20:['هُوَ رَسُولٌ كَرِيمٌ'],
  21:['بَا','تَا','ثَا','نَا'],22:['بِي','تِي','فِي','لِي'],23:['هٰذِهِ','فِيهِ'],24:['بُو','تُو','نُو','هُو'],25:['دَاوُدُ','هُوَ'],
  26:['أَبْ','أَتْ','مِنْ','لَمْ','هَلْ'],27:['كِتَابًا','عِلْمًا','نُورًا'],28:['كِتَابٍ','عِلْمٍ','نُورٍ'],29:['كِتَابٌ','عِلْمٌ','نُورٌ'],
  30:['رَبَّ','إِنَّ','ثُمَّ'],31:['حَقًّا','رَبًّا'],32:['حَقٍّ','رَبٍّ'],33:['حَقٌّ','رَبٌّ'],34:['اقْرَأْ بِتَأَنٍّ','رَاعِ الحَرَكَاتِ وَالمَدَّ وَالسُّكُونَ']
 };
 const items=unit===1?(letters[lesson]||letters[1]):(lessonMap[lesson]||[title]),
   prompt=document.getElementById('prompt'),hint=document.getElementById('hint'),bar=document.getElementById('bar');
 let i=0,playbackToken=0;

 const directAudio=document.getElementById('directAudio'),
   humanAudio=document.getElementById('humanAudio'),
   directAudioBox=document.getElementById('directAudioBox'),
   lessonVideoBox=document.getElementById('lessonVideoBox'),
   audioNote=document.getElementById('audioNote'),
   audioStatus=document.getElementById('audioStatus'),
   sourceLink=document.getElementById('sourceLink');

 lessonVideoBox.hidden=true;
 audioNote.textContent='';

 const letterIndex={
  'أ':'01','ء':'01','إ':'01','آ':'01','ؤ':'01','ئ':'01',
  'ب':'02','ت':'03','ث':'04','ج':'05','ح':'06','خ':'07','د':'08','ذ':'09',
  'ر':'10','ز':'11','س':'12','ش':'13','ص':'14','ض':'15','ط':'16','ظ':'17',
  'ع':'18','غ':'19','ف':'20','ق':'21','ك':'22','ل':'23','م':'24','ن':'25',
  'ه':'26','و':'27','ي':'28','ى':'28','ة':'03'
 };
 const letterNameFile={
  'أ':'Alif.mp3','ء':'HAMZA.mp3','ب':'Ba.mp3','ت':'TAA.mp3','ث':'THAA.mp3',
  'ج':'JEEM.mp3','ح':'HAA.mp3','خ':'KHAA.mp3','د':'DAAL.mp3','ذ':'THAAL.mp3',
  'ر':'RAA.mp3','ز':'ZAY.mp3','س':'SEEN.mp3','ش':'SHEEN.mp3','ص':'SAD.mp3',
  'ض':'DAD.mp3','ط':'TAA-1.mp3','ظ':'DHAA.mp3','ع':'AIN.mp3','غ':'GHAIN.mp3',
  'ف':'FAA.mp3','ق':'QAF.mp3','ك':'KAF.mp3','ل':'LAAM.mp3','م':'MEEM.mp3',
  'ن':'NOON.mp3','ه':'HAA-1.mp3','و':'WAW.mp3','ي':'YAA.mp3'
 };
 const softBase='https://softarabic.com/wp-content/uploads/2012/05/alphabets/';
 const arabicOmBase='https://arabic-om.com/wp-content/uploads/2026/06/';
 const sourcePages={
   fathah:'https://softarabic.com/arabic-pronunciation-of-the-letters-with-the-short-vowel-fathah/',
   dammah:'https://softarabic.com/arabic-letters-with-short-vowel-dammah/',
   kasrah:'https://softarabic.com/arabic-letters-with-short-vowel-kasrah/',
   alif:'https://softarabic.com/arabic-letters-with-the-long-vowel-alif/',
   yaa:'https://softarabic.com/arabic-letters-with-long-vowel-yaa/',
   waw:'https://softarabic.com/the-arabic-letters-ba/',
   sukun:'https://softarabic.com/the-arabic-letters-ba/',
   'tanwin-fathah':'https://softarabic.com/the-arabic-letters-ba/',
   'tanwin-dammah':'https://softarabic.com/the-arabic-letters-ba/',
   'tanwin-kasrah':'https://softarabic.com/the-arabic-letters-ba/',
   'shadda-fathah':'https://softarabic.com/the-arabic-letters-ba/',
   'shadda-dammah':'https://softarabic.com/the-arabic-letters-ba/',
   'shadda-kasrah':'https://softarabic.com/the-arabic-letters-ba/',
   'tanwin-shadda-fathah':'https://softarabic.com/the-arabic-letters-ba/',
   'tanwin-shadda-dammah':'https://softarabic.com/the-arabic-letters-ba/',
   'tanwin-shadda-kasrah':'https://softarabic.com/the-arabic-letters-ba/'
 };

 const normalizeBase=x=>{
   const raw=String(x||'').normalize('NFC').replace(/[\u064b-\u065f\u0670\u06d6-\u06edـ]/g,'');
   let ch=[...raw].find(z=>/[ء-يىة]/.test(z))||'';
   if(['إ','آ','ؤ','ئ'].includes(ch))ch='أ';
   if(ch==='ى')ch='ي';
   if(ch==='ة')ch='ت';
   return ch;
 };
 const graphemes=text=>{
   try{return [...new Intl.Segmenter('ar',{granularity:'grapheme'}).segment(String(text||''))].map(x=>x.segment)}
   catch{return Array.from(String(text||''))}
 };
 const hasMark=(g,m)=>String(g).includes(m);
 const isBareLong=(g,ch)=>normalizeBase(g)===ch&&!/[\u064b-\u0652\u0670]/.test(g);
 const kindFor=(g)=>{
   const sh=hasMark(g,'ّ');
   if(hasMark(g,'ً'))return sh?'tanwin-shadda-fathah':'tanwin-fathah';
   if(hasMark(g,'ٌ'))return sh?'tanwin-shadda-dammah':'tanwin-dammah';
   if(hasMark(g,'ٍ'))return sh?'tanwin-shadda-kasrah':'tanwin-kasrah';
   if(sh&&hasMark(g,'َ'))return 'shadda-fathah';
   if(sh&&hasMark(g,'ُ'))return 'shadda-dammah';
   if(sh&&hasMark(g,'ِ'))return 'shadda-kasrah';
   if(hasMark(g,'ْ'))return 'sukun';
   if(hasMark(g,'َ'))return 'fathah';
   if(hasMark(g,'ُ'))return 'dammah';
   if(hasMark(g,'ِ'))return 'kasrah';
   return null;
 };
 const shortKindForLong=k=>k==='alif'?'fathah':k==='yaa'?'kasrah':k==='waw'?'dammah':null;
 const soundUrl=(base,kind)=>{
   const idx=letterIndex[base];return idx&&kind?softBase+kind+'/letter-'+idx+'.mp3':'';
 };
 const nameUrl=base=>{
   const b=base==='ء'?'ء':base,file=letterNameFile[b]||letterNameFile[normalizeBase(base)];
   return file?arabicOmBase+file:'';
 };

 const tokenize=text=>{
   const gs=graphemes(text),out=[];
   for(let n=0;n<gs.length;n++){
     const g=gs[n];
     if(/^\s+$/.test(g)||/^[،؛,.!?؟:()\-–—]+$/.test(g))continue;
     const base=normalizeBase(g);if(!base)continue;
     let kind=kindFor(g),display=g;
     if(hasMark(g,'ٰ'))kind='alif';
     const next=gs[n+1];
     if(kind==='fathah'&&next&&(isBareLong(next,'ا')||isBareLong(next,'ى'))){kind='alif';display+=next;n++}
     else if(kind==='kasrah'&&next&&isBareLong(next,'ي')){kind='yaa';display+=next;n++}
     else if(kind==='dammah'&&next&&isBareLong(next,'و')){kind='waw';display+=next;n++}
     out.push({display,base,kind});
   }
   return out;
 };

 const urlsForToken=t=>{
   if(!t?.base)return[];
   const nm=nameUrl(t.base);
   if(!t.kind)return nm?[nm]:[];
   const snd=soundUrl(t.base,t.kind);
   const short=shortKindForLong(t.kind);
   if(short){
     const shortSound=soundUrl(t.base,short);
     // Teacher-like contrast: letter name -> short sound, then name -> short -> long.
     return [nm,shortSound,nm,shortSound,snd,snd].filter(Boolean);
   }
   // Movement, sukun, tanween, and shadda: name -> exact sound -> repeat exact sound.
   return [nm,snd,snd].filter(Boolean);
 };

 const urlsForTarget=text=>{
   const tokens=tokenize(text);
   if(!tokens.length)return[];
   const slow=tokens.flatMap(urlsForToken);
   // For words/phrases, finish by reading the component sounds once more with shorter pauses.
   const direct=tokens.map(t=>t.kind?soundUrl(t.base,t.kind):nameUrl(t.base)).filter(Boolean);
   return tokens.length>1?[...slow,{gap:420},...direct]:slow;
 };

 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const stopAudio=()=>{playbackToken++;directAudio.pause();directAudio.removeAttribute('src');directAudio.load();audioStatus.textContent=''};
 const playUrl=(src,token)=>new Promise(resolve=>{
   if(!src||token!==playbackToken)return resolve(false);
   let settled=false;
   const done=ok=>{if(settled)return;settled=true;clearTimeout(timer);directAudio.onended=null;directAudio.onerror=null;resolve(ok)};
   const timer=setTimeout(()=>done(false),7000);
   directAudio.onended=()=>done(true);
   directAudio.onerror=()=>done(false);
   directAudio.src=src;directAudio.currentTime=0;
   const p=directAudio.play();if(p?.catch)p.catch(()=>done(false));
 });
 const playSequence=async(seq,token,fast=false)=>{
   for(const part of seq){
     if(token!==playbackToken)return false;
     if(part&&typeof part==='object'&&part.gap){await sleep(part.gap);continue}
     const ok=await playUrl(part,token);
     if(token!==playbackToken)return false;
     await sleep(fast?100:(ok?190:40));
   }
   return true;
 };
 const sourceForTarget=text=>{
   const k=tokenize(text).map(x=>x.kind).find(Boolean);
   return sourcePages[k]||'https://softarabic.com/the-arabic-letters-ba/';
 };

 const render=()=>{
   prompt.textContent=items[i];
   hint.textContent='🔊   '+(i+1)+' / '+items.length;
   bar.style.width=((i+1)/items.length*100)+'%';
   document.getElementById('choices').innerHTML='';
   document.getElementById('prev').disabled=i===0;
   document.getElementById('next').disabled=i===items.length-1;
   sourceLink.href=sourceForTarget(items[i]);
 };

 const prepareAudio=()=>{
   humanAudio.hidden=false;directAudioBox.hidden=false;lessonVideoBox.hidden=true;sourceLink.hidden=false;
   audioNote.textContent='';sourceLink.textContent='مصدر التسجيلات البشرية';
 };

 const playTeacherCard=async()=>{
   stopAudio();const token=playbackToken;prepareAudio();
   const seq=urlsForTarget(items[i]);
   if(!seq.length){audioStatus.textContent='لا يتوفر تسجيل مطابق لهذه البطاقة حتى الآن.';return}
   audioStatus.textContent='🔊';
   await playSequence(seq,token,false);
   if(token===playbackToken)audioStatus.textContent='';
 };

 const playWholeLesson=async()=>{
   stopAudio();const token=playbackToken;prepareAudio();
   const original=i;audioStatus.textContent='▶';
   try{
     for(let n=0;n<items.length;n++){
       if(token!==playbackToken)return;
       i=n;render();
       const seq=urlsForTarget(items[n]);
       await playSequence(seq,token,false);
       if(token!==playbackToken)return;
       await sleep(450);
     }
   }finally{
     if(token===playbackToken){i=original;render();audioStatus.textContent=''}
   }
 };

 document.getElementById('speak').onclick=()=>playTeacherCard().catch(()=>{audioStatus.textContent='تعذر تشغيل التسجيل؛ أعد المحاولة.'});
 document.getElementById('again').onclick=()=>playTeacherCard().catch(()=>{audioStatus.textContent='تعذر تشغيل التسجيل؛ أعد المحاولة.'});
 document.getElementById('lessonExplain').onclick=()=>playWholeLesson().catch(()=>{audioStatus.textContent='تعذر تشغيل الدرس؛ أعد المحاولة.'});
 document.getElementById('prev').onclick=()=>{stopAudio();if(i>0){i--;render()}};
 document.getElementById('next').onclick=()=>{stopAudio();if(i<items.length-1){i++;render()}};
 render();
})();
</script></body></html>
