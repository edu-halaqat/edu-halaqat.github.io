<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>تعيين كلمة مرور جديدة | سنابل الوحي</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#073d34,#0a5a49);font-family:Tahoma,Arial,sans-serif;color:#153b33}.shell{width:min(520px,100%);padding:34px;border-radius:24px;background:#fff;box-shadow:0 28px 75px #001f1970;text-align:center}.mark{font-size:44px;color:#b6822c}.shell h1{margin:8px 0 12px}.shell p{line-height:1.9;color:#65746f}.shell a{display:inline-block;margin-top:18px;color:#006b55;font-weight:700}#sanabil-password-reset form{text-align:right}noscript{color:#9b2c2c}
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="mark">❖</div>
      <h1>استعادة كلمة المرور</h1>
      <p>يتم التحقق من رابط الاستعادة. ستظهر حقول تعيين كلمة المرور الجديدة خلال لحظات.</p>
      <p>إذا لم تظهر الحقول، فالرابط غير صالح أو منتهي الصلاحية.</p>
      <a href="/">العودة إلى تسجيل الدخول</a>
      <noscript>يجب تفعيل JavaScript لإكمال تعيين كلمة المرور.</noscript>
    </main>
    <script src="/password-recovery.js"></script>
  </body>
</html>
