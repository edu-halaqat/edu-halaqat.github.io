name: Verify encrypted video signaling
on:
  push:
    branches: [main]
    paths:
      - 'sanabil-video-crypto.js'
      - 'sanabil-free-live.js'
      - 'sanabil-free-student.html'
      - 'tests/sanabil-video-*.cjs'
      - '.github/workflows/verify-sanabil-free-live.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/sanabil-video-invitations.cjs
      - run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @supabase/supabase-js@2.78.0
      - run: node tests/sanabil-video-signaling.cjs
