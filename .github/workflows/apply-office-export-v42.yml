name: Apply Tallam Office export v4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-office-export-v42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portal and admin cache versions
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              '20260901-synchronized-export-repair-v2': '20260902-office-export-v3',
              '4.0.0-synchronized-page-v1': '4.2.0-synchronized-office-v3',
              '4.1.0-synchronized-rgb-v2': '4.2.0-synchronized-office-v3',
          }
          roots = [Path('tallam'), Path('.github/workflows/pages.yml'), Path('.github/workflows/public-verify-tallam.yml')]
          changed = []
          for root in roots:
              paths = [root] if root.is_file() else [p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.css','.json','.webmanifest','.yml','.yaml'}]
              for path in paths:
                  text = path.read_text(encoding='utf-8')
                  updated = text
                  for old, new in replacements.items():
                      updated = updated.replace(old, new)
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed.append(str(path))
          required = [
              Path('tallam/index.html'),
              Path('tallam/admin/index.html'),
              Path('tallam/assets/js/bootstrap.js'),
              Path('tallam/assets/js/app-submit.js'),
              Path('tallam/assets/js/ministry-preview-renderer.js'),
              Path('tallam/assets/js/form-readiness-v2.js'),
              Path('tallam/admin/regenerate.js'),
              Path('.github/workflows/pages.yml'),
              Path('.github/workflows/public-verify-tallam.yml'),
          ]
          for path in required:
              value = path.read_text(encoding='utf-8')
              if '20260901-synchronized-export-repair-v2' in value or '4.0.0-synchronized-page-v1' in value or '4.1.0-synchronized-rgb-v2' in value:
                  raise SystemExit(f'Old release marker remains in {path}')
          print('Updated files:')
          print('\n'.join(changed))
          PY
          node --check tallam/assets/js/bootstrap.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/ministry-preview-renderer.js
          node --check tallam/assets/js/form-readiness-v2.js
          node --check tallam/admin/regenerate.js
          grep -Fq '20260902-office-export-v3' tallam/index.html
          grep -Fq '4.2.0-synchronized-office-v3' tallam/assets/js/app-submit.js
          grep -Fq '4.2.0-synchronized-office-v3' tallam/assets/js/ministry-preview-renderer.js
      - name: Commit and push release update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tallam Portal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tallam .github/workflows/pages.yml .github/workflows/public-verify-tallam.yml
          if git diff --cached --quiet; then
            echo 'No changes were required.'
            exit 0
          fi
          git commit -m 'نشر محرك Word وPDF المتوافق وإعادة التوليد v4.2'
          git push origin HEAD:main
