name: Publish Tallam Teachers Portal

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-tallam-portal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and validate Tallam portal
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin deploy-tallam-portal
          rm -rf /tmp/tallam-archive-source /tmp/tallam-extracted
          mkdir -p /tmp/tallam-archive-source /tmp/tallam-extracted
          git archive origin/deploy-tallam-portal .deploy/tallam .deploy/tallam-site.b64.part-00 | tar -x -C /tmp/tallam-archive-source

          python3 - <<'PY'
          from __future__ import annotations
          import base64
          import gzip
          import io
          import itertools
          import lzma
          import re
          import shutil
          import tarfile
          from pathlib import Path

          source = Path('/tmp/tallam-archive-source')
          destination = Path('/tmp/tallam-extracted')

          def read_parts(pattern: str) -> list[str]:
              values = []
              for path in sorted(source.glob(pattern)):
                  value = re.sub(r'\s+', '', path.read_text(encoding='utf-8'))
                  if value:
                      values.append(value)
                      print(f'part {path}: {len(value)} characters')
              return values

          groups = [
              ('archive19', read_parts('.deploy/tallam/archive19/chunk-*')),
              ('parts', read_parts('.deploy/tallam/part-*.b64')),
              ('archive', read_parts('.deploy/tallam/archive.b64.*')),
              ('single', read_parts('.deploy/tallam-site.b64.part-*')),
          ]

          def overlap(left: str, right: str) -> int:
              maximum = min(len(left), len(right))
              for size in range(maximum, 0, -1):
                  if left.endswith(right[:size]):
                      return size
              return 0

          def merge_order(items: tuple[str, ...]) -> str:
              merged = items[0]
              for item in items[1:]:
                  if item in merged:
                      continue
                  if merged in item:
                      merged = item
                      continue
                  merged += item[overlap(merged, item):]
              return merged

          def safe_extract(archive: tarfile.TarFile, target: Path) -> None:
              target_resolved = target.resolve()
              for member in archive.getmembers():
                  member_path = (target / member.name).resolve()
                  if target_resolved not in member_path.parents and member_path != target_resolved:
                      raise RuntimeError(f'unsafe archive member: {member.name}')
              archive.extractall(target)

          def try_payload(encoded: str, label: str) -> bool:
              padded = encoded + ('=' * (-len(encoded) % 4))
              try:
                  raw = base64.b64decode(padded, validate=True)
              except Exception as exc:
                  print(f'{label}: base64 rejected ({exc})')
                  return False

              decoders = [
                  ('xz', lzma.decompress),
                  ('gzip', gzip.decompress),
                  ('plain', lambda value: value),
              ]
              for compression, decoder in decoders:
                  try:
                      tar_bytes = decoder(raw)
                      with tarfile.open(fileobj=io.BytesIO(tar_bytes), mode='r:*') as archive:
                          names = [name.lstrip('./') for name in archive.getnames()]
                          index_names = [name for name in names if name == 'index.html' or name.endswith('/index.html')]
                          if not index_names:
                              continue
                          shutil.rmtree(destination, ignore_errors=True)
                          destination.mkdir(parents=True, exist_ok=True)
                          safe_extract(archive, destination)
                      print(f'usable archive found: {label}, {compression}, {len(raw)} bytes')
                      return True
                  except Exception:
                      continue
              print(f'{label}: decoded but no usable tar archive')
              return False

          found = False
          for group_name, parts in groups:
              unique = []
              for value in parts:
                  if value not in unique:
                      unique.append(value)
              if not unique:
                  continue
              candidates: set[str] = set()
              for count in range(1, len(unique) + 1):
                  for order in itertools.permutations(unique, count):
                      candidates.add(merge_order(order))
              for number, candidate in enumerate(sorted(candidates, key=len), 1):
                  if try_payload(candidate, f'{group_name}-{number}-len{len(candidate)}'):
                      found = True
                      break
              if found:
                  break

          if not found:
              raise SystemExit('No valid Tallam portal archive could be reconstructed.')
          PY

          if [ -f /tmp/tallam-extracted/index.html ]; then
            source_dir=/tmp/tallam-extracted
          elif [ -f /tmp/tallam-extracted/site/index.html ]; then
            source_dir=/tmp/tallam-extracted/site
          else
            index_path="$(find /tmp/tallam-extracted -maxdepth 4 -type f -name index.html | head -n 1)"
            test -n "$index_path"
            source_dir="$(dirname "$index_path")"
          fi

          test -f "$source_dir/index.html"
          test -f "$source_dir/admin/index.html"
          test -f "$source_dir/assets/js/app.js"
          test -f "$source_dir/assets/js/ministry-export.js"

          rm -rf tallam
          mkdir -p tallam
          cp -a "$source_dir"/. tallam/

      - name: Commit portal files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tallam
          if git diff --cached --quiet; then
            echo "Tallam portal is already current."
            exit 0
          fi
          git commit -m "Publish Tallam teachers portal"
          git push origin HEAD:main
