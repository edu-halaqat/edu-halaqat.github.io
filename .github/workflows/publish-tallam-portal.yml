name: Publish Tallam Teachers Portal

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/publish-tallam-portal.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebuild and validate Tallam portal
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin deploy-tallam-portal

          : > /tmp/tallam-site.b64
          for part in chunk-00 chunk-01 chunk-02; do
            git show "origin/deploy-tallam-portal:.deploy/tallam/archive19/${part}" >> /tmp/tallam-site.b64
          done

          base64 --decode /tmp/tallam-site.b64 > /tmp/tallam-site.tar.xz
          xz --test /tmp/tallam-site.tar.xz

          rm -rf /tmp/tallam-extracted
          mkdir -p /tmp/tallam-extracted
          tar -xJf /tmp/tallam-site.tar.xz -C /tmp/tallam-extracted

          if [ -f /tmp/tallam-extracted/index.html ]; then
            source_dir=/tmp/tallam-extracted
          elif [ -f /tmp/tallam-extracted/site/index.html ]; then
            source_dir=/tmp/tallam-extracted/site
          else
            index_path="$(find /tmp/tallam-extracted -maxdepth 3 -type f -name index.html | head -n 1)"
            test -n "$index_path"
            source_dir="$(dirname "$index_path")"
          fi

          test -f "$source_dir/index.html"
          test -f "$source_dir/admin/index.html"
          test -f "$source_dir/assets/js/app.js"
          test -f "$source_dir/assets/js/ministry-export.js"

          rm -rf tallam
          mkdir -p tallam
          cp -a "$source_dir"/. tallam/

      - name: Commit portal files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tallam
          if git diff --cached --quiet; then
            echo "Tallam portal is already current."
            exit 0
          fi
          git commit -m "Publish Tallam teachers portal"
          git push origin HEAD:main
