name: Plan horizon safety
on:
  pull_request:
    paths:
      - 'db/maintenance/plan-horizon-*.sql'
      - 'tests/plan-horizon-*.sql'
      - '.github/workflows/plan-horizon-safe.yml'
permissions:
  contents: read
jobs:
  postgres-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: horizon_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
      PGDATABASE: horizon_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Verify curriculum and rollback in isolated PostgreSQL 17
        run: psql -v ON_ERROR_STOP=1 -f tests/plan-horizon-safe.sql
