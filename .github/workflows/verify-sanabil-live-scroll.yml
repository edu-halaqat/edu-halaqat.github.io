name: Verify Sanabil Mobile Video Scroll
on:
  push:
    branches: [fix/sanabil-live-mobile-scroll-20261015]
  pull_request:
    paths:
      - 'sanabil-free-live.js'
      - 'sanabil-free-live.css'
      - 'sanabil-live-v12.js'
      - 'index.html'
      - 'tests/sanabil-live-scroll-smoke.cjs'
permissions:
  contents: read
jobs:
  scroll-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check video and app syntax
        run: |
          node --check sanabil-free-live.js
          node --check sanabil-live-v12.js
      - name: Check mobile scroll invariants
        run: node tests/sanabil-live-scroll-smoke.cjs
