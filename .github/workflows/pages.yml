name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate synchronized Office export release
        shell: bash
        run: |
          set -euo pipefail
          RELEASE='20260902-office-export-v3'
          EXPORT='4.2.0-synchronized-office-v3'

          test -s tallam/index.html
          test -s tallam/admin/index.html
          test -s tallam/admin/admin.js
          test -s tallam/admin/archive.js
          test -s tallam/admin/regenerate.js
          test -s tallam/admin/archive-refresh-bridge.js
          test -s tallam/assets/js/bootstrap.js
          test -s tallam/assets/js/app-submit.js
          test -s tallam/assets/js/ministry-preview-renderer.js
          test -s tallam/assets/js/form-readiness-v2.js
          test -s tallam/assets/js/file-cache.js
          test -s tallam/assets/js/ministry-background.js
          for number in $(seq -w 1 14); do test -s "tallam/assets/js/ministry-bg-${number}.js"; done

          node --check tallam/admin/admin.js
          node --check tallam/admin/archive.js
          node --check tallam/admin/regenerate.js
          node --check tallam/admin/archive-refresh-bridge.js
          node --check tallam/assets/js/bootstrap.js
          node --check tallam/assets/js/app-core.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/ministry-preview-renderer.js
          node --check tallam/assets/js/form-readiness-v2.js
          node --check tallam/assets/js/file-cache.js
          node --check tallam/assets/js/file-readiness-bridge.js
          node --check tallam/assets/js/ministry-background.js

          grep -Fq "$RELEASE" tallam/index.html
          grep -Fq "$RELEASE" tallam/assets/js/bootstrap.js
          grep -Fq "$RELEASE" tallam/admin/index.html
          grep -Fq "$RELEASE" tallam/assets/js/form-readiness-v2.js
          grep -Fq "$EXPORT" tallam/assets/js/ministry-preview-renderer.js
          grep -Fq "$EXPORT" tallam/assets/js/app-submit.js
          grep -Fq "$EXPORT" tallam/admin/regenerate.js
          grep -Fq 'TallamMinistryPreviewRenderer' tallam/assets/js/bootstrap.js
          grep -Fq 'form-readiness-v2.js' tallam/assets/js/bootstrap.js
          grep -Fq 'ministry_form_preview' tallam/assets/js/app-submit.js
          grep -Fq 'download_urls' tallam/assets/js/app-submit.js
          grep -Fq 'teacher-export-repair' tallam/admin/regenerate.js
          grep -Fq 'إعادة توليد التالفة ومزامنتها' tallam/admin/regenerate.js
          grep -Fq 'tallam:archive-refresh' tallam/admin/regenerate.js
          grep -Fq 'masterArchiveRebuild' tallam/admin/archive-refresh-bridge.js
          ! grep -Fq 'ministry-export-final.js' tallam/assets/js/bootstrap.js
          ! grep -Fq 'TallamMinistryExporter' tallam/assets/js/form-readiness-v2.js
          ! grep -Fq 'if (!window.JSZip)' tallam/assets/js/form-readiness-v2.js
          ! grep -Fq 'data.append("ministry_form_docx"' tallam/assets/js/app-submit.js
          ! grep -Fq 'data.append("ministry_form_pdf"' tallam/assets/js/app-submit.js

          node <<'NODE'
          const crypto = require('crypto');
          global.window = global;
          for (let index = 1; index <= 14; index += 1) {
            require(`./tallam/assets/js/ministry-bg-${String(index).padStart(2, '0')}.js`);
          }
          require('./tallam/assets/js/ministry-background.js');
          const prefix = 'data:image/webp;base64,';
          const source = String(global.TallamOfficialMinistryBackground || '');
          if (!source.startsWith(prefix)) throw new Error('Ministry background was not assembled.');
          const bytes = Buffer.from(source.slice(prefix.length), 'base64');
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          if (bytes.length !== 77924) throw new Error(`Unexpected WebP size: ${bytes.length}`);
          if (bytes.subarray(0, 4).toString('ascii') !== 'RIFF' || bytes.subarray(8, 12).toString('ascii') !== 'WEBP') {
            throw new Error('Invalid WebP header.');
          }
          if (sha256 !== '977bf87fa55a137b85734c72f0dc86d3c37612dc5d2f7f3fd6234ec0fca4bb6f') {
            throw new Error(`Unexpected ministry background SHA-256: ${sha256}`);
          }
          console.log(`Official ministry background verified: ${bytes.length} bytes`);
          NODE

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='_site/' \
            --exclude='tallam-final-source/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
