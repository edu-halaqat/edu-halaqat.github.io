name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Tallam teachers portal
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f tallam/index.html ]; then
            mkdir -p tallam
            cat .deploy/tallam/part-*.b64 | base64 --decode > /tmp/tallam-site.tar.gz
            tar -xzf /tmp/tallam-site.tar.gz -C tallam
          fi
          rm -rf .deploy/tallam /tmp/tallam-site.tar.gz
          test -f tallam/index.html
          test -f tallam/admin/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
