name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Tallam portal release
        shell: bash
        run: |
          set -euo pipefail
          test -s tallam/index.html
          test -s tallam/admin/index.html
          test -s tallam/admin/admin.js
          test -s tallam/assets/js/bootstrap.js
          test -s tallam/assets/js/ministry-export-final.js
          test -s tallam/assets/img/ministry-form-background.png
          test -s tallam/assets/fragments/application-1.html
          test -s tallam/assets/fragments/application-2.html

          node --check tallam/admin/admin.js
          node --check tallam/assets/js/bootstrap.js
          node --check tallam/assets/js/app-core.js
          node --check tallam/assets/js/ministry-export-final.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/form-readiness.js

          grep -q '20260830-final-png-v2' tallam/index.html
          grep -q '20260830-final-png-v2' tallam/assets/js/bootstrap.js
          grep -q 'ministry-form-background.png' tallam/assets/js/bootstrap.js
          grep -q 'ministry-export-final.js' tallam/assets/js/bootstrap.js
          grep -q 'TallamMinistryExporter' tallam/assets/js/ministry-export-final.js
          grep -q '/FlateDecode' tallam/assets/js/ministry-export-final.js
          grep -q 'form-image.png' tallam/assets/js/ministry-export-final.js
          grep -q '<wp:inline' tallam/assets/js/ministry-export-final.js
          ! grep -q '/DCTDecode' tallam/assets/js/ministry-export-final.js
          ! grep -q '<wp:anchor' tallam/assets/js/ministry-export-final.js
          grep -q 'submitBtn.disabled = !ready' tallam/assets/js/form-readiness.js
          grep -q 'Mad3@tallam.sa' tallam/admin/admin.js
          grep -q 'signInWithOtp' tallam/admin/admin.js
          grep -q 'method: "DELETE"' tallam/admin/admin.js
          grep -q 'حذف الطلب نهائيًا' tallam/admin/admin.js

          python3 <<'PY'
          from pathlib import Path
          import struct
          import zlib

          data = Path('tallam/assets/img/ministry-form-background.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          offset = 8
          chunks = []
          width = height = bit_depth = color_type = None
          saw_iend = False
          while offset + 12 <= len(data):
              length = struct.unpack('>I', data[offset:offset + 4])[0]
              kind = data[offset + 4:offset + 8]
              start = offset + 8
              end = start + length
              assert end + 4 <= len(data), (kind, length, len(data), offset)
              payload = data[start:end]
              crc_expected = struct.unpack('>I', data[end:end + 4])[0]
              assert zlib.crc32(kind + payload) & 0xffffffff == crc_expected, kind
              if kind == b'IHDR':
                  width, height, bit_depth, color_type = struct.unpack('>IIBB', payload[:10])
              elif kind == b'IDAT':
                  chunks.append(payload)
              elif kind == b'IEND':
                  saw_iend = True
                  break
              offset = end + 4
          assert (width, height) == (1414, 2000)
          assert bit_depth in (8, 16)
          assert color_type in (0, 2, 3, 4, 6)
          assert chunks and saw_iend
          decoded = zlib.decompress(b''.join(chunks))
          channels = {0: 1, 2: 3, 3: 1, 4: 2, 6: 4}[color_type]
          expected = height * (1 + ((width * channels * bit_depth + 7) // 8))
          assert len(decoded) == expected, (len(decoded), expected)
          print(f'Official PNG verified: {width}x{height}, {len(data)} bytes')
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='_site/' \
            --exclude='tallam-final-source/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
