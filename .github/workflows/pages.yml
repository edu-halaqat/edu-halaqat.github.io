name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check Sanabil user messaging
        run: |
          node --check sanabil-honor-roll.js
          node tests/sanabil-honor-roll.cjs
          node --check sanabil-live-v12.js
          node tests/sanabil-live-runtime-boot.cjs
          node --check sanabil-complex-staff.js
          node --check sanabil-registry-management.js
          node --check sanabil-v13-enhancements.js
          node tests/sanabil-bulk-circle-settings.cjs
          node tests/sanabil-exam-nominations.cjs
          node --check sanabil-exam-distribution.js
          node tests/sanabil-user-whatsapp.cjs
          node tests/sanabil-outcome-whatsapp.cjs
          node --check sanabil-excel-v11.js
          node --check sanabil-offline-app.js
          node tests/sanabil-performance.cjs
          node --check sanabil-performance-center.js
          node tests/sanabil-performance-center.cjs
          node --check sanabil-plan-calendar.js
          node tests/sanabil-plan-workflows-20261024.cjs
          node tests/sanabil-calendar-complex-batch-20261025.cjs
          node tests/sanabil-calendar-instant-20261025.cjs
          node tests/sanabil-calendar-mobile-navigation-20261025.cjs
          node tests/sanabil-calendar-bulk-default-20261025.cjs
          node tests/sanabil-calendar-default-status-20261025.cjs
          node tests/sanabil-video-invitations.cjs
          node tests/sanabil-video-return.cjs
          node tests/sanabil-install.cjs
          node --check sanabil-updater.js
          node tests/sanabil-updater-talaqqin.cjs
          node tests/sanabil-talaqqin-day-extension.cjs
          node --check sanabil-performance-deep.js
          node tests/sanabil-performance-deep.cjs
          node --check sanabil-lazy.js
          node tests/sanabil-lazy.cjs
          node tests/sanabil-sw-versioned-cache.cjs
          node --check sanabil-performance.js
          node tests/sanabil-performance-real.cjs
          node --check sanabil-arabic-ui.js
          node tests/sanabil-central-activity.cjs
          node tests/sanabil-arabic-ui.cjs
          node tests/sanabil-student-float-nav.cjs
          node --check sanabil-voice.js
          node --check sanabil-voice-global.js
          node --check sanabil-quick-outcomes.js
          node tests/sanabil-quick-outcomes.cjs
          node tests/sanabil-exclusive-quick-view.cjs
          node --check sanabil-live-ops.js
          node tests/sanabil-one-touch.cjs
          node --check sanabil-teacher-productivity.js
          node tests/sanabil-teacher-productivity.cjs
          node --check sanabil-teacher-fast-path.js
          node tests/sanabil-teacher-fast-path.cjs
          node --check sanabil-scoring-ui.js
          node tests/sanabil-scoring.cjs
          node tests/sanabil-voice-global.cjs
          node tests/sanabil-voice-nomination.cjs
          node tests/sanabil-natural-commands.cjs
          node --check sanabil-updater.js
          node tests/sanabil-update-voice-entry.cjs
          node tests/sanabil-voice-responsive.cjs
          node tests/sanabil-teacher-home-voice.cjs

      - name: Verify durable batched synchronization
        env:
          NODE_PATH: ${{ runner.temp }}/sanabil-offline-tests/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/sanabil-offline-tests" --no-save --ignore-scripts --no-audit --no-fund fake-indexeddb@6.2.5
          node tests/sanabil-offline-smoke.cjs
          node tests/sanabil-batch-scheduling.cjs

      - name: Set up Python for high-contrast icons
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Sanabil visible icons
        run: |
          python -m pip install --disable-pip-version-check --quiet 'Pillow>=11,<13'
          python scripts/build_pwa_icons.py
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          for icon in manifest['icons']:
              path=Path('.'+icon['src'])
              assert path.is_file(), f'Missing generated icon: {path}'
              with Image.open(path) as img:
                  assert f'{img.width}x{img.height}' == icon['sizes'], icon
                  assert img.mode in ('RGB','RGBA')
          print('PASS: branded Android any/maskable icons are generated and sized correctly')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Sanabil PWA and user WhatsApp release
        run: |
          python3 - <<'PY'
          import json, time, subprocess, struct, re
          from pathlib import Path
          base='https://snabilalwahy.com'
          expected=re.search(r'name="sanabil-build" content="([^"]+)"',Path('index.html').read_text()).group(1)
          def read(path):
              # Default Python-urllib user-agent is rejected with HTTP 403 by Cloudflare,
              # while curl and a normal browser return 200 for the same public endpoint.
              # Keep HTTPS verification and fail on any HTTP error or absent asset.
              completed=subprocess.run(
                  ['curl','-fsSL','--proto','=https','--connect-timeout','10',
                   '--max-time','25',base+path],
                  capture_output=True,check=True)
              return completed.stdout
          for attempt in range(8):
              try:
                  html=read('/?verify='+expected).decode()
                  assert expected in html
                  assert 'rel="manifest"' in html
                  manifest=json.loads(read('/manifest.webmanifest'))
                  assert manifest['display']=='standalone' and manifest['scope']=='/'
                  for icon in manifest['icons']:
                      data=read(icon['src'])
                      assert data[:8]==b'\x89PNG\r\n\x1a\n'
                      w,h=struct.unpack('>II',data[16:24])
                      assert f'{w}x{h}'==icon['sizes']
                  sw=read('/sanabil-offline-sw.js?verify='+expected).decode()
                  assert "self.addEventListener('fetch'" in sw
                  script=re.search(r'src="(/sanabil-live-v12.js[^"]*)"',html).group(1)
                  js=read(script).decode()
                  assert 'userWhatsAppDialog' in js and expected in js
                  assert 'loadCircleSessionData' in js
                  # Check the actual HTTPS deployment, not the GitHub source,
                  # for the newly released complex/circle holiday calendar.
                  cal_asset=re.search(r'src="(/sanabil-plan-calendar\.js\?v=[^"]+)"',html)
                  assert cal_asset, 'Published calendar script missing from live page'
                  cal_script=read(cal_asset.group(1)).decode()
                  assert 'get_calendar_management_scope_guarded' in cal_script
                  assert 'apply_calendar_days_bulk_guarded' in cal_script
                  assert 'العودة للتقويم الافتراضي' in cal_script
                  assert 'get_calendar_reflow_status_guarded' in cal_script
                  assert 'sl-complex-group' in cal_script
                  assert 'get_circle_day_types_range_guarded' in cal_script
                  assert "make('a'" not in cal_script, 'External calendar links still clickable'
                  assert "event?.preventDefault?.()" in cal_script, 'Month navigation must block ghost taps'
                  assert 'monthlyCache' in cal_script

                  assert 'التسميع المرئي' in js
                  # Confirm the actual published release includes the permanent
                  # installation action and that it is not initially hidden.
                  assert 'data-action="install-pwa"' in js
                  assert 'data-action="install-pwa" hidden' not in js
                  install_script=re.search(r'src="(/sanabil-install\.js[^"]*)"',html)
                  assert install_script, 'Installer script missing from published HTML'
                  install_js=read(install_script.group(1)).decode()
                  assert 'SanabilInstaller={bind,check,install,isAppWindow}' in install_js
                  assert 'render(isAppWindow()||justInstalled)' in install_js
                  assert 'createInvite' in read('/sanabil-free-live.js?v=approved1').decode()
                  assert 'AES-GCM' in read('/sanabil-video-crypto.js?v=1').decode()
                  assert 'sanabil-honor-roll.js?v=20261020-layout1' in html
                  assert 'snabil_honor_roll_cycle' in read('/sanabil-honor-roll.js?v=20261020-layout1').decode()
                  assert 'SanabilPerformance' in read('/sanabil-performance.js').decode()
                  assert 'sanabil-lazy.js?v=20261022-v1' in html
                  assert "loadDeepPerformance:()=>load('deepPerformance')" in read('/sanabil-lazy.js?v=20261022-v1').decode()
                  assert 'sanabil_performance_save_dryrun' in read('/sanabil-performance-deep.js').decode()
                  assert 'data-deep>بدء الاختبار الموسع' in js
                  v13_match=re.search(r'src="(/sanabil-v13-enhancements\.js[^"]*)"',html)
                  assert v13_match, 'Enhanced interface JS missing from deployed HTML'
                  v13_code=read(v13_match.group(1)).decode()
                  assert 'apply_circle_settings_bulk' in v13_code
                  assert 'apply_fingerprint_period_bulk' in v13_code
                  assert 'data-real-results' in js
                  assert 'data-outcome-float-nav' in js
                  assert 'sanabil-registry-management.js?v=20261021-circles-scope1' in html
                  assert 'لا يمكن تفعيل سجل معلم بلا حساب رسمي' in read('/sanabil-registry-management.js?v=20261021-circles-scope1').decode()
                  assert 'sanabil-voice.js' in html
                  assert 'sanabil-updater.js' in html
                  assert 'sanabil-update-prompt-v3' in read('/sanabil-updater.js').decode()
                  assert 'function showLauncher()' in read('/sanabil-voice.js').decode()
                  assert 'sl-voice-manual' in read('/sanabil-voice.js').decode()
                  assert 'matchingStudents' in read('/sanabil-voice.js').decode()
                  assert "mode==='add'" in read('/sanabil-voice.js').decode()
                  assert "const manual=document.createElement('div')" in read('/sanabil-voice.js').decode()
                  assert "outcomesPage(panel)" not in js
                  assert 'root.hidden=!needsAttention' in read('/sanabil-offline-app.js').decode()
                  assert 'window.SanabilVoice?.showLauncher?.()' in js
                  assert 'SanabilVoice' in read('/sanabil-voice.js').decode()
                  assert 'data-outcome-student-id' in read('/sanabil-free-live.js').decode()
                  assert 'tl-nominate-' in js and 'nominate-' in js
                  assert 'data-float-top' in js and 'data-float-bottom' in js
                  assert '.sl-outcome-float-nav' in read('/sanabil-identity.css').decode()
                  assert "recordActual('save_student'" in js
                  assert 'afterPaintActual' in read('/sanabil-performance.js').decode()
                  assert 'cdn.jsdelivr.net/npm/exceljs' not in html
                  assert "register('/sanabil-offline-sw.js" in js
                  print('PASS: live release, PWA manifest, PNG icon dimensions, service worker registration, WhatsApp integration')
                  break
              except Exception as e:
                  if attempt==7: raise
                  print('Waiting for deployment propagation:',type(e).__name__)
                  time.sleep(10)
          PY
