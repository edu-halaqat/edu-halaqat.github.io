name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build final Tallam export assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 .github/scripts/build_tallam_final.py --root .

          test -s tallam/assets/img/ministry-form-background.png
          test -s tallam/assets/js/ministry-export-final.js
          node --check tallam/assets/js/bootstrap.js
          node --check tallam/assets/js/app-core.js
          node --check tallam/assets/js/ministry-export-final.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/form-readiness.js

          grep -q '20260829-final-png-v1' tallam/index.html
          grep -q '20260829-final-png-v1' tallam/assets/js/bootstrap.js
          grep -q '20260829-final-png-v1' tallam/assets/js/ministry-export-final.js
          grep -q 'ministry-form-background.png' tallam/assets/js/bootstrap.js
          grep -q 'ministry-export-final.js' tallam/assets/js/bootstrap.js
          ! grep -q 'ministry-bg-' tallam/assets/js/bootstrap.js
          ! grep -q 'ministry-background.js' tallam/assets/js/bootstrap.js
          grep -q '/FlateDecode' tallam/assets/js/ministry-export-final.js
          grep -q 'form-image.png' tallam/assets/js/ministry-export-final.js
          ! grep -q '/DCTDecode' tallam/assets/js/ministry-export-final.js
          grep -q 'submitBtn.disabled = !ready' tallam/assets/js/form-readiness.js

      - name: Generate and inspect real Word and PDF outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tallam-final-qa
          mkdir -p /tmp/tallam-final-qa/out
          cp tallam/assets/img/ministry-form-background.png /tmp/tallam-final-qa/
          cp tallam/assets/js/ministry-export-final.js /tmp/tallam-final-qa/

          cat > /tmp/tallam-final-qa/server.py <<'PY'
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          import os

          root = Path(__file__).resolve().parent
          out = root / "out"
          out.mkdir(exist_ok=True)
          os.chdir(root)

          class Handler(SimpleHTTPRequestHandler):
              def do_POST(self):
                  parsed = urlparse(self.path)
                  if not parsed.path.startswith("/save/"):
                      self.send_error(404)
                      return
                  name = Path(unquote(parsed.path.removeprefix("/save/"))).name
                  size = int(self.headers.get("Content-Length", "0"))
                  if size <= 0 or size > 10_000_000:
                      self.send_error(413)
                      return
                  (out / name).write_bytes(self.rfile.read(size))
                  self.send_response(204)
                  self.end_headers()

              def log_message(self, *_args):
                  pass

          ThreadingHTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY

          cat > /tmp/tallam-final-qa/index.html <<'HTML'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
          <script>window.TallamOfficialMinistryBackground="ministry-form-background.png";</script>
          <script src="ministry-export-final.js"></script></head>
          <body data-export-test="pending">جارٍ اختبار التصدير
          <script>
          (async () => {
            const keepAlive = setInterval(() => document.documentElement.dataset.tick = String(Date.now()), 100);
            try {
              const signature = document.createElement("canvas");
              signature.width = 900; signature.height = 240;
              const context = signature.getContext("2d");
              context.strokeStyle = "#063f3d"; context.lineWidth = 10; context.lineCap = "round";
              context.beginPath(); context.moveTo(90, 165); context.bezierCurveTo(260, 40, 430, 220, 810, 80); context.stroke();
              const signatureBlob = await new Promise((resolve, reject) => signature.toBlob((blob) => blob ? resolve(blob) : reject(new Error("signature")), "image/png"));

              const photo = document.createElement("canvas");
              photo.width = 600; photo.height = 740;
              const pc = photo.getContext("2d");
              pc.fillStyle = "#fff"; pc.fillRect(0, 0, 600, 740);
              pc.fillStyle = "#ddb277"; pc.beginPath(); pc.arc(300, 180, 95, 0, Math.PI * 2); pc.fill();
              pc.fillStyle = "#006b69"; pc.fillRect(165, 300, 270, 330);
              const photoFile = await new Promise((resolve, reject) => photo.toBlob((blob) => blob ? resolve(new File([blob], "photo.png", { type: "image/png" })) : reject(new Error("photo")), "image/png"));

              const values = {
                full_name: "محمد أحمد عبد الله السلمي",
                identity_number: "1012345678",
                identity_type: "هوية وطنية",
                identity_expiry: "2030-12-30",
                nationality: "سعودي",
                gender: "ذكر",
                birth_place_date: "المدينة المنورة - 01/01/1410هـ",
                qualification: "بكالوريوس",
                specialization: "الدراسات القرآنية",
                workplace: "جمعية تعلّم",
                job_title: "معلم قرآن كريم",
                phone: "0140000000",
                mobile: "551234567",
                city: "المدينة المنورة",
                region: "منطقة المدينة المنورة",
                district: "الخالدية",
                street: "طريق الهجرة",
                building_number: "1234",
                apartment_number: "9",
                twitter: "tallam@",
                facebook: "لا يوجد",
                email: "teacher@example.com"
              };

              const output = await window.TallamMinistryExporter.generate({ values, photoFile, signatureBlob });
              if (output.exportBuild !== "20260829-final-png-v1") throw new Error("Wrong exporter build");
              const responses = await Promise.all([
                fetch("/save/qa.docx", { method: "POST", body: output.docxBlob }),
                fetch("/save/qa.pdf", { method: "POST", body: output.pdfBlob })
              ]);
              if (responses.some((response) => !response.ok)) throw new Error("Could not save QA outputs");

              clearInterval(keepAlive);
              document.body.dataset.exportTest = "success";
              document.body.textContent = `EXPORT_OK DOCX=${output.docxBlob.size} PDF=${output.pdfBlob.size}`;
            } catch (error) {
              clearInterval(keepAlive);
              document.body.dataset.exportTest = "error";
              document.body.textContent = `EXPORT_ERROR ${error?.stack || error}`;
            }
          })();
          </script></body></html>
          HTML

          python3 /tmp/tallam-final-qa/server.py >/tmp/tallam-final-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --run-all-compositor-stages-before-draw --virtual-time-budget=90000 --dump-dom \
            http://127.0.0.1:8765/ > /tmp/tallam-final-dom.html
          if ! grep -q 'data-export-test="success"' /tmp/tallam-final-dom.html; then
            cat /tmp/tallam-final-dom.html >&2
            exit 1
          fi
          test -s /tmp/tallam-final-qa/out/qa.docx
          test -s /tmp/tallam-final-qa/out/qa.pdf

          python3 <<'PY'
          from io import BytesIO
          from pathlib import Path
          from PIL import Image
          import re
          import zipfile
          import zlib

          root = Path("/tmp/tallam-final-qa")
          docx_path = root / "out" / "qa.docx"
          pdf_path = root / "out" / "qa.pdf"

          with zipfile.ZipFile(docx_path) as archive:
              assert archive.testzip() is None, "DOCX ZIP CRC validation failed"
              names = set(archive.namelist())
              assert "word/media/form-image.png" in names, "DOCX form image is missing"
              assert "word/document.xml" in names, "DOCX document XML is missing"
              document_xml = archive.read("word/document.xml")
              assert b"<wp:inline" in document_xml and b"<wp:anchor" not in document_xml
              png_bytes = archive.read("word/media/form-image.png")

          image = Image.open(BytesIO(png_bytes)).convert("RGB")
          assert image.size == (1414, 2000), f"Unexpected DOCX image size: {image.size}"
          pixels = image.load()
          anchors = {
              (15, 15): (255, 255, 255),
              (1375, 1970): (255, 255, 255),
              (710, 1910): (255, 255, 255),
              (1200, 1200): (255, 255, 255),
              (1000, 450): (194, 214, 155),
              (900, 650): (234, 241, 221),
          }
          for point, expected in anchors.items():
              actual = pixels[point]
              assert max(abs(actual[i] - expected[i]) for i in range(3)) <= 18, (point, actual, expected)

          # The reported failure produced large black rectangles and dense scan-line noise.
          # A valid form never has a predominantly black 64x64 tile below the header area.
          worst = 0.0
          for top in range(760, image.height - 63, 32):
              for left in range(0, image.width - 63, 32):
                  tile = image.crop((left, top, left + 64, top + 64))
                  dark = sum(1 for red, green, blue in tile.getdata() if red < 45 and green < 45 and blue < 45)
                  worst = max(worst, dark / 4096)
          assert worst < 0.30, f"Corrupted black tile detected: {worst:.3f}"

          pdf = pdf_path.read_bytes()
          assert pdf.startswith(b"%PDF-1.4")
          image_marker = pdf.index(b"/Subtype /Image")
          stream_marker = pdf.index(b"stream\n", image_marker)
          header = pdf[image_marker:stream_marker]
          length_match = re.search(rb"/Length\s+(\d+)", header)
          assert length_match, "PDF image stream length is missing"
          stream_length = int(length_match.group(1))
          stream_start = stream_marker + len(b"stream\n")
          compressed = pdf[stream_start:stream_start + stream_length]
          raw_rgb = zlib.decompress(compressed)
          expected_rgb = image.tobytes()
          assert len(raw_rgb) == 1414 * 2000 * 3
          assert raw_rgb == expected_rgb, "PDF pixels differ from the verified DOCX PNG"
          print(f"Verified final outputs: DOCX={docx_path.stat().st_size}, PDF={pdf_path.stat().st_size}, worst_dark_tile={worst:.3f}")
          PY

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='_site/' \
            ./ _site/
          touch _site/.nojekyll
          test -s _site/tallam/assets/img/ministry-form-background.png
          test -s _site/tallam/assets/js/ministry-export-final.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4