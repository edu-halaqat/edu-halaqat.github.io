name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Tallam portal release
        shell: bash
        run: |
          set -euo pipefail
          test -s tallam/index.html
          test -s tallam/admin/index.html
          test -s tallam/admin/admin.js
          test -s tallam/assets/js/bootstrap.js
          test -s tallam/assets/js/ministry-background.js
          test -s tallam/assets/js/ministry-export-final.js
          test -s tallam/assets/fragments/application-1.html
          test -s tallam/assets/fragments/application-2.html
          for number in $(seq -w 1 14); do test -s "tallam/assets/js/ministry-bg-${number}.js"; done

          node --check tallam/admin/admin.js
          node --check tallam/assets/js/bootstrap.js
          node --check tallam/assets/js/app-core.js
          node --check tallam/assets/js/ministry-background.js
          node --check tallam/assets/js/ministry-export-final.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/form-readiness.js
          for number in $(seq -w 1 14); do node --check "tallam/assets/js/ministry-bg-${number}.js"; done

          grep -q '20260831-admin-onedrive-v1' tallam/index.html
          grep -q '20260831-admin-onedrive-v1' tallam/assets/js/bootstrap.js
          grep -q 'ministry-bg-' tallam/assets/js/bootstrap.js
          grep -q 'ministry-background.js' tallam/assets/js/bootstrap.js
          grep -q 'ministry-export-final.js' tallam/assets/js/bootstrap.js
          grep -q 'TallamMinistryExporter' tallam/assets/js/ministry-export-final.js
          grep -q '/FlateDecode' tallam/assets/js/ministry-export-final.js
          grep -q 'form-image.png' tallam/assets/js/ministry-export-final.js
          grep -q '<wp:inline' tallam/assets/js/ministry-export-final.js
          ! grep -q '/DCTDecode' tallam/assets/js/ministry-export-final.js
          ! grep -q '<wp:anchor' tallam/assets/js/ministry-export-final.js
          grep -q 'submitBtn.disabled = !ready' tallam/assets/js/form-readiness.js
          grep -q 'Mad3@tallam.sa' tallam/admin/admin.js
          grep -q 'signInWithOtp' tallam/admin/admin.js
          grep -q 'method: "DELETE"' tallam/admin/admin.js
          grep -q 'حذف الطلب نهائيًا' tallam/admin/admin.js

          node <<'NODE'
          const crypto = require('crypto');
          global.window = global;
          for (let index = 1; index <= 14; index += 1) {
            require(`./tallam/assets/js/ministry-bg-${String(index).padStart(2, '0')}.js`);
          }
          require('./tallam/assets/js/ministry-background.js');
          const prefix = 'data:image/webp;base64,';
          if (!String(global.TallamOfficialMinistryBackground || '').startsWith(prefix)) {
            throw new Error('The official ministry background data URI was not assembled.');
          }
          const bytes = Buffer.from(global.TallamOfficialMinistryBackground.slice(prefix.length), 'base64');
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          if (bytes.length !== 77924) throw new Error(`Unexpected WebP size: ${bytes.length}`);
          if (bytes.subarray(0, 4).toString('ascii') !== 'RIFF' || bytes.subarray(8, 12).toString('ascii') !== 'WEBP') {
            throw new Error('Invalid WebP header.');
          }
          if (sha256 !== '977bf87fa55a137b85734c72f0dc86d3c37612dc5d2f7f3fd6234ec0fca4bb6f') {
            throw new Error(`Unexpected ministry background SHA-256: ${sha256}`);
          }
          console.log(`Official WebP verified: ${bytes.length} bytes, ${sha256}`);
          NODE

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.deploy/' \
            --exclude='_site/' \
            --exclude='tallam-final-source/' \
            ./ _site/
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
