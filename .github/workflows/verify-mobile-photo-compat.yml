name: Verify mobile file stability

on:
  push:
    branches: [main]
    paths:
      - 'tallam/assets/js/file-cache.js'
      - 'tallam/assets/js/file-readiness-bridge.js'
      - 'tallam/assets/js/app-submit.js'
      - 'tallam/assets/js/bootstrap.js'
      - 'tallam/index.html'
      - 'tallam/edit.html'
      - '.github/workflows/verify-mobile-photo-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE: 20261005-requests-hardening-v2
      CACHE_BUILD: 20260831-mobile-provider-v4
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript and stable-file integration
        shell: bash
        run: |
          set -euo pipefail
          node --check tallam/assets/js/file-cache.js
          node --check tallam/assets/js/file-readiness-bridge.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/bootstrap.js
          grep -Fq 'captureAll(form)' tallam/assets/js/app-submit.js
          grep -Fq 'getInputFile(input)' tallam/assets/js/app-submit.js
          grep -Fq '__tallamStableFile' tallam/assets/js/file-cache.js
          grep -Fq 'requested file could not be read' tallam/assets/js/file-cache.js
          grep -Fq 'document.getElementById("editForm")' tallam/assets/js/file-cache.js
          grep -Fq "const CACHE_COMPAT_BUILD = \"${CACHE_BUILD}\"" tallam/assets/js/bootstrap.js
          grep -Fq "const RELEASE = \"${RELEASE}\"" tallam/assets/js/bootstrap.js
          grep -Fq "bootstrap.js?v=${RELEASE}" tallam/index.html
          grep -Fq 'window.TallamFileCache' tallam/edit.html

      - name: Verify stable PDF copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tallam-file-test
          cp tallam/assets/js/file-cache.js /tmp/tallam-file-test/
          cat > /tmp/tallam-file-test/index.html <<'HTML'
          <!doctype html><html><body data-result="loading">
          <form id="editForm"><div class="file-card"><label for="cv">السيرة الذاتية</label><input id="cv" name="cv" type="file"></div></form>
          <script src="file-cache.js"></script>
          <script>
          (async()=>{
            try{
              const input=document.getElementById('cv');
              const original=new File([new TextEncoder().encode('%PDF-1.4\nprobe')],'cv.pdf',{type:'application/pdf'});
              const transfer=new DataTransfer();transfer.items.add(original);input.files=transfer.files;
              input.dispatchEvent(new Event('change',{bubbles:true}));
              const stable=await window.TallamFileCache.getInputFile(input);
              const bytes=new Uint8Array(await stable.arrayBuffer());
              if(!stable.__tallamStableFile||bytes.length!==original.size||stable.type!=='application/pdf') throw new Error('Stable PDF copy invalid');
              document.body.dataset.result='success';
            }catch(error){
              document.body.dataset.result='error';
              document.body.dataset.error=String(error?.stack||error);
            }
          })();
          </script></body></html>
          HTML
          cd /tmp/tallam-file-test
          python3 -m http.server 8123 >/tmp/tallam-file-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          timeout 45s "$CHROME" --headless=new --disable-gpu --disable-dev-shm-usage --no-sandbox             --virtual-time-budget=12000 --dump-dom http://127.0.0.1:8123/ > /tmp/tallam-file-dom.html
          grep -Fq 'data-result="success"' /tmp/tallam-file-dom.html
