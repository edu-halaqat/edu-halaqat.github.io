name: Verify mobile file stability and personal photo compatibility

on:
  push:
    branches: [main]
    paths:
      - 'tallam/assets/js/file-cache.js'
      - 'tallam/assets/js/file-readiness-bridge.js'
      - 'tallam/assets/js/mobile-photo-compat.js'
      - 'tallam/assets/js/app-submit.js'
      - 'tallam/assets/js/bootstrap.js'
      - 'tallam/index.html'
      - '.github/workflows/verify-mobile-photo-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260831-file-reference-v3
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript and wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check tallam/assets/js/file-cache.js
          node --check tallam/assets/js/file-readiness-bridge.js
          node --check tallam/assets/js/mobile-photo-compat.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/bootstrap.js
          grep -Fq 'file-cache.js' tallam/assets/js/bootstrap.js
          grep -Fq 'file-readiness-bridge.js' tallam/assets/js/bootstrap.js
          grep -Fq 'captureAll(form)' tallam/assets/js/app-submit.js
          grep -Fq 'getInputFile(input)' tallam/assets/js/app-submit.js
          grep -Fq '__tallamStableFile' tallam/assets/js/file-cache.js
          grep -Fq 'requested file could not be read' tallam/assets/js/file-cache.js
          grep -Fq '__mobilePhotoCompatibility' tallam/assets/js/mobile-photo-compat.js
          grep -Fq "bootstrap.js?v=${BUILD}" tallam/index.html

          python3 - <<'PY'
          from pathlib import Path
          bootstrap = Path('tallam/assets/js/bootstrap.js').read_text(encoding='utf-8')
          order = [
              bootstrap.index('assets/js/file-cache.js'),
              bootstrap.index('assets/js/app-core.js'),
              bootstrap.index('assets/js/ministry-export-final.js'),
              bootstrap.index('assets/js/mobile-photo-compat.js'),
              bootstrap.index('assets/js/app-submit.js'),
              bootstrap.index('assets/js/form-readiness.js'),
              bootstrap.index('assets/js/file-readiness-bridge.js'),
          ]
          assert order == sorted(order), order
          PY

      - name: Verify stable copy and image normalization in Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tallam-file-test
          cp tallam/assets/js/file-cache.js /tmp/tallam-file-test/
          cp tallam/assets/js/mobile-photo-compat.js /tmp/tallam-file-test/

          python3 <<'PY'
          from pathlib import Path
          import struct, zlib

          width, height = 160, 240
          signature = b'\x89PNG\r\n\x1a\n'
          def chunk(kind, payload):
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
          ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  row.extend(((x * 255) // max(1, width - 1), (y * 255) // max(1, height - 1), 230))
              rows.append(bytes(row))
          data = signature + chunk(b'IHDR', ihdr) + chunk(b'sRGB', b'\x00') + chunk(b'IDAT', zlib.compress(b''.join(rows), 9)) + chunk(b'IEND', b'')
          Path('/tmp/tallam-file-test/test-photo.png').write_bytes(data)
          PY

          cat > /tmp/tallam-file-test/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"></head><body data-result="loading">
          <form id="teacherForm"></form>
          <script src="file-cache.js"></script>
          <script>
          window.TallamMinistryExporter = Object.freeze({
            async generate(options) {
              const photo = await new Promise((resolve, reject) => {
                const image = new Image();
                const url = URL.createObjectURL(options.photoFile);
                image.onload = () => { URL.revokeObjectURL(url); resolve(image); };
                image.onerror = () => { URL.revokeObjectURL(url); reject(new Error('تعذرت قراءة الصورة الشخصية.')); };
                image.src = url;
              });
              const canvas = document.createElement('canvas');
              canvas.width = 80; canvas.height = 120;
              const context = canvas.getContext('2d');
              context.drawImage(photo, 0, 0, 80, 120);
              context.getImageData(0, 0, 1, 1);
              return { width: photo.naturalWidth || photo.width, height: photo.naturalHeight || photo.height };
            }
          });
          </script>
          <script src="mobile-photo-compat.js"></script>
          <script>
          (async () => {
            const fail = (error) => {
              document.body.dataset.result = 'error';
              document.body.dataset.error = String(error && error.stack || error);
            };
            try {
              const original = new File([new TextEncoder().encode('temporary-provider-file')], 'document.pdf', { type: 'application/pdf' });
              const nativeArrayBuffer = original.arrayBuffer.bind(original);
              let reads = 0;
              Object.defineProperty(original, 'arrayBuffer', {
                configurable: true,
                value: () => {
                  reads += 1;
                  if (reads > 1) return Promise.reject(new DOMException(
                    'The requested file could not be read, typically due to permission problems that have occurred after a reference to a file was acquired.',
                    'NotReadableError'
                  ));
                  return nativeArrayBuffer();
                }
              });

              const stable = await window.TallamFileCache.getStableFile(original, 'المرفق التجريبي');
              await original.arrayBuffer().then(
                () => { throw new Error('The original reference unexpectedly remained readable.'); },
                () => {}
              );
              const stableBytes = new Uint8Array(await stable.arrayBuffer());
              if (!stable.__tallamStableFile || stableBytes.length !== original.size) throw new Error('Stable copy is invalid.');

              const response = await fetch('test-photo.png');
              const photoOriginal = new File([await response.arrayBuffer()], 'test-photo.png', { type: 'image/png' });
              const photoStable = await window.TallamFileCache.getStableFile(photoOriginal, 'الصورة الشخصية');
              const result = await Promise.race([
                window.TallamMinistryExporter.generate({ photoFile: photoStable }),
                new Promise((_resolve, reject) => setTimeout(() => reject(new Error('Photo normalization timed out.')), 20000))
              ]);
              if (result.width !== 160 || result.height !== 240) throw new Error(`Unexpected normalized dimensions: ${result.width}x${result.height}`);

              document.body.dataset.result = 'success';
              document.body.dataset.reads = String(reads);
              document.body.dataset.fileCache = String(Boolean(window.TallamFileCache));
            } catch (error) {
              fail(error);
            }
          })();
          </script></body></html>
          HTML

          cd /tmp/tallam-file-test
          python3 -m http.server 8123 >/tmp/tallam-file-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          timeout 60s "$CHROME" --headless=new --disable-gpu --disable-dev-shm-usage --no-sandbox --virtual-time-budget=30000 \
            --dump-dom http://127.0.0.1:8123/ > /tmp/tallam-file-dom.html
          if ! grep -Fq 'data-result="success"' /tmp/tallam-file-dom.html; then
            cat /tmp/tallam-file-dom.html
            exit 1
          fi
          grep -Fq 'data-file-cache="true"' /tmp/tallam-file-dom.html
          grep -Fq 'data-reads="2"' /tmp/tallam-file-dom.html

      - name: Verify deployed files
        shell: bash
        run: |
          set -euo pipefail
          fetch_expected() {
            local url="$1" output="$2" expected="$3"
            for attempt in $(seq 1 48); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${url}?v=${BUILD}&attempt=${attempt}" --output "$output" \
                && test -s "$output" && grep -Fq "$expected" "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          fetch_expected "${BASE_URL}/" /tmp/tallam-live-index.html "bootstrap.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/bootstrap.js" /tmp/tallam-live-bootstrap.js "${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/file-cache.js" /tmp/tallam-live-cache.js "TallamFileCache"
          fetch_expected "${BASE_URL}/assets/js/file-readiness-bridge.js" /tmp/tallam-live-bridge.js "${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/mobile-photo-compat.js" /tmp/tallam-live-photo.js "${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/app-submit.js" /tmp/tallam-live-submit.js "captureAll(form)"
          node --check /tmp/tallam-live-bootstrap.js
          node --check /tmp/tallam-live-cache.js
          node --check /tmp/tallam-live-bridge.js
          node --check /tmp/tallam-live-photo.js
          node --check /tmp/tallam-live-submit.js
          echo 'Stable mobile-file release verified.'
