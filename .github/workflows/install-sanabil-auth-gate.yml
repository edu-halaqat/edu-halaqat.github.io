name: Install Sanabil auth gate

on:
  push:
    branches: [main]
    paths:
      - 'auth-gate.js'
      - '.github/workflows/install-sanabil-auth-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install auth gate in published HTML
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/auth-gate.js" defer></script>'
          if tag not in s:
              s = s.replace('</head>', tag + '</head>', 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit patched index
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html already patched'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix(sanabil): wire published login to Supabase Auth'
          git push
