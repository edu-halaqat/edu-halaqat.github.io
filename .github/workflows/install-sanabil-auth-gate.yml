name: Install Sanabil auth gate

on:
  push:
    branches: [main]
    paths:
      - 'auth-gate.js'
      - 'sanabil-admin-entry.js'
      - '.github/workflows/install-sanabil-auth-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Sanabil scripts in Pages artifact
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="/auth-gate.js" defer></script>',
              '<script src="/sanabil-admin-entry.js" defer></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</head>', tag + '</head>', 1)
          p.write_text(s, encoding='utf-8')

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
