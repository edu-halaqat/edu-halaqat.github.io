name: Install Sanabil auth gate

# Script tags are now versioned in index.html. A second deploy workflow used
# to cancel the main Pages deployment and inject duplicate login handlers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify committed Sanabil entry points
        shell: python
        run: |
          from pathlib import Path
          html = Path("index.html").read_text()
          assert html.count('src="/auth-gate.js') == 1
          assert html.count('src="/sanabil-live.js') == 1
          assert Path("auth-gate.js").is_file()
          assert Path("sanabil-live.js").is_file()
