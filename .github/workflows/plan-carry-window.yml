name: Plan carry equivalence
on:
  pull_request:
    paths:
      - 'db/maintenance/optimize-plan-carry-window.sql'
      - 'tests/plan-carry-window.sql'
      - '.github/workflows/plan-carry-window.yml'
  push:
    branches: [main]
    paths:
      - 'db/maintenance/optimize-plan-carry-window.sql'
      - 'tests/plan-carry-window.sql'
      - '.github/workflows/plan-carry-window.yml'
permissions:
  contents: read
jobs:
  postgres-equivalence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: carry_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: fixture-only-password
      PGDATABASE: carry_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Compare update behavior on isolated synthetic data
        run: psql -v ON_ERROR_STOP=1 -f tests/plan-carry-window.sql
