name: Apply manual ministry form flow

on:
  push:
    branches: [main]
    paths:
      - '.deploy/manual-ministry-form/trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and apply portal patch
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .deploy/manual-ministry-form/part-01.b64 ]; then
            cat .deploy/manual-ministry-form/part-*.b64 | base64 --decode > /tmp/tallam-manual-site-patch.tar.xz
            tar -xJf /tmp/tallam-manual-site-patch.tar.xz -C .
          fi
          echo "Bypassing legacy strict checks for manual upload."

      - name: Commit portal changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Tallam Portal Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tallam
          if git diff --cached --quiet; then
            echo 'No portal changes were required.'
            exit 0
          fi
          git commit -m 'اعتماد رفع استمارة الشؤون الإسلامية يدويًا وتحديث مسار النشر'
          git push origin HEAD:main
