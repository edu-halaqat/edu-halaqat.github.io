name: Verify Android temporary photo provider handling

on:
  push:
    branches: [main]
    paths:
      - 'tallam/assets/js/file-cache.js'
      - 'tallam/assets/js/bootstrap.js'
      - 'tallam/index.html'
      - '.github/workflows/verify-android-photo-provider-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260831-mobile-provider-v4
    steps:
      - uses: actions/checkout@v4

      - name: Validate release wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check tallam/assets/js/file-cache.js
          node --check tallam/assets/js/bootstrap.js
          grep -Fq 'event.stopImmediatePropagation()' tallam/assets/js/file-cache.js
          grep -Fq 'loadHtmlImage(source, label)' tallam/assets/js/file-cache.js
          grep -Fq 'image/jpeg' tallam/assets/js/file-cache.js
          grep -Fq "const BUILD = \"${BUILD}\"" tallam/assets/js/bootstrap.js
          grep -Fq "bootstrap.js?v=${BUILD}" tallam/index.html

      - name: Simulate an Android image reference that rejects raw byte reads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/android-photo-provider-test
          cp tallam/assets/js/file-cache.js /tmp/android-photo-provider-test/

          python3 <<'PY'
          from pathlib import Path
          import struct, zlib

          width, height = 160, 240
          signature = b'\x89PNG\r\n\x1a\n'
          def chunk(kind, payload):
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
          ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  row.extend(((x * 255) // max(1, width - 1), (y * 255) // max(1, height - 1), 230))
              rows.append(bytes(row))
          data = signature + chunk(b'IHDR', ihdr) + chunk(b'sRGB', b'\x00') + chunk(b'IDAT', zlib.compress(b''.join(rows), 9)) + chunk(b'IEND', b'')
          Path('/tmp/android-photo-provider-test/photo.png').write_bytes(data)
          PY

          cat > /tmp/android-photo-provider-test/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"></head><body data-result="loading">
          <form id="teacherForm">
            <div class="file-card">
              <label for="personal_photo">الصورة الشخصية للرجال</label>
              <input id="personal_photo" name="personal_photo" type="file" accept="image/jpeg,image/png">
            </div>
          </form>
          <script src="file-cache.js"></script>
          <script>
          (async () => {
            const input = document.getElementById('personal_photo');
            let targetChanges = 0;
            let listenerSawOriginal = false;

            input.addEventListener('change', async () => {
              targetChanges += 1;
              const received = input.files && input.files[0];
              if (!received || !received.__tallamStableFile) listenerSawOriginal = true;
              if (received) await received.arrayBuffer();
            });

            try {
              const response = await fetch('photo.png');
              const original = new File([await response.arrayBuffer()], '1000469953.jpg', { type: 'image/jpeg' });
              Object.defineProperty(original, 'arrayBuffer', {
                configurable: true,
                value: () => Promise.reject(new DOMException(
                  'The requested file could not be read, typically due to permission problems that have occurred after a reference to a file was acquired.',
                  'NotReadableError'
                ))
              });

              const transfer = new DataTransfer();
              transfer.items.add(original);
              input.files = transfer.files;
              input.dispatchEvent(new Event('change', { bubbles: true }));

              const deadline = Date.now() + 20000;
              while (Date.now() < deadline) {
                const state = window.TallamFileCache.stateOf(input);
                if (state.state === 'error') throw new Error(state.error);
                if (state.state === 'ready' && targetChanges === 1) break;
                await new Promise((resolve) => setTimeout(resolve, 50));
              }

              const stable = await window.TallamFileCache.getInputFile(input);
              const image = new Image();
              const url = URL.createObjectURL(stable);
              await new Promise((resolve, reject) => {
                image.onload = resolve;
                image.onerror = reject;
                image.src = url;
              });
              URL.revokeObjectURL(url);

              if (targetChanges !== 1) throw new Error(`Expected one safe change event, got ${targetChanges}.`);
              if (listenerSawOriginal) throw new Error('A downstream listener received the temporary provider file.');
              if (!stable.__tallamStableFile) throw new Error('Stable marker is missing.');
              if (stable.type !== 'image/jpeg') throw new Error(`Unexpected stable type: ${stable.type}`);
              if (!/-stable\.jpg$/i.test(stable.name || '')) throw new Error(`Unexpected stable name: ${stable.name}`);
              if (image.naturalWidth !== 160 || image.naturalHeight !== 240) {
                throw new Error(`Unexpected stable dimensions: ${image.naturalWidth}x${image.naturalHeight}`);
              }

              document.body.dataset.result = 'success';
              document.body.dataset.targetChanges = String(targetChanges);
              document.body.dataset.stableType = stable.type;
            } catch (error) {
              document.body.dataset.result = 'error';
              document.body.dataset.error = String(error && error.stack || error);
            }
          })();
          </script></body></html>
          HTML

          cd /tmp/android-photo-provider-test
          python3 -m http.server 8125 >/tmp/android-photo-provider-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          timeout 70s "$CHROME" --headless=new --disable-gpu --disable-dev-shm-usage --no-sandbox \
            --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8125/ > /tmp/android-photo-provider-dom.html
          if ! grep -Fq 'data-result="success"' /tmp/android-photo-provider-dom.html; then
            cat /tmp/android-photo-provider-dom.html
            exit 1
          fi
          grep -Fq 'data-target-changes="1"' /tmp/android-photo-provider-dom.html
          grep -Fq 'data-stable-type="image/jpeg"' /tmp/android-photo-provider-dom.html

      - name: Verify deployed v4 files
        shell: bash
        run: |
          set -euo pipefail
          fetch_expected() {
            local url="$1" output="$2" expected="$3"
            for attempt in $(seq 1 48); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${url}?v=${BUILD}&attempt=${attempt}" --output "$output" \
                && test -s "$output" && grep -Fq "$expected" "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          fetch_expected "${BASE_URL}/" /tmp/tallam-v4-index.html "bootstrap.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/bootstrap.js" /tmp/tallam-v4-bootstrap.js "const BUILD = \"${BUILD}\""
          fetch_expected "${BASE_URL}/assets/js/file-cache.js" /tmp/tallam-v4-cache.js "const CACHE_BUILD = \"${BUILD}\""
          node --check /tmp/tallam-v4-bootstrap.js
          node --check /tmp/tallam-v4-cache.js
          echo 'Android temporary-photo provider handling verified.'
