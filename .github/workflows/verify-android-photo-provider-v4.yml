name: Verify Android temporary file provider handling

on:
  push:
    branches: [main]
    paths:
      - 'tallam/assets/js/file-cache.js'
      - 'tallam/assets/js/bootstrap.js'
      - 'tallam/index.html'
      - 'tallam/edit.html'
      - '.github/workflows/verify-android-photo-provider-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE: 20261005-requests-hardening-v2
      CACHE_BUILD: 20260831-mobile-provider-v4
    steps:
      - uses: actions/checkout@v4

      - name: Validate current file-cache wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check tallam/assets/js/file-cache.js
          node --check tallam/assets/js/bootstrap.js
          grep -Fq 'event.stopImmediatePropagation()' tallam/assets/js/file-cache.js
          grep -Fq 'loadHtmlImage(source, label)' tallam/assets/js/file-cache.js
          grep -Fq 'image/jpeg' tallam/assets/js/file-cache.js
          grep -Fq 'document.getElementById("editForm")' tallam/assets/js/file-cache.js
          grep -Fq "const CACHE_COMPAT_BUILD = \"${CACHE_BUILD}\"" tallam/assets/js/bootstrap.js
          grep -Fq "const RELEASE = \"${RELEASE}\"" tallam/assets/js/bootstrap.js
          grep -Fq "bootstrap.js?v=${RELEASE}" tallam/index.html

      - name: Simulate Android image provider
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/android-photo-provider-test
          cp tallam/assets/js/file-cache.js /tmp/android-photo-provider-test/
          python3 <<'PY'
          from pathlib import Path
          import struct, zlib
          width, height = 160, 240
          signature = b'\x89PNG\r\n\x1a\n'
          def chunk(kind, payload):
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload) & 0xffffffff)
          ihdr = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
          rows=[]
          for y in range(height):
              row=bytearray([0])
              for x in range(width):
                  row.extend(((x*255)//max(1,width-1),(y*255)//max(1,height-1),230))
              rows.append(bytes(row))
          data=signature+chunk(b'IHDR',ihdr)+chunk(b'sRGB',b'\x00')+chunk(b'IDAT',zlib.compress(b''.join(rows),9))+chunk(b'IEND',b'')
          Path('/tmp/android-photo-provider-test/photo.png').write_bytes(data)
          PY
          cat > /tmp/android-photo-provider-test/index.html <<'HTML'
          <!doctype html><html><body data-result="loading">
          <form id="editForm"><div class="file-card"><label for="personal_photo">الصورة الشخصية</label><input id="personal_photo" name="personal_photo" type="file" accept="image/jpeg,image/png"></div></form>
          <script src="file-cache.js"></script>
          <script>
          (async()=>{
            const input=document.getElementById('personal_photo');
            try{
              const response=await fetch('photo.png');
              const original=new File([await response.arrayBuffer()],'photo.jpg',{type:'image/jpeg'});
              const transfer=new DataTransfer();transfer.items.add(original);input.files=transfer.files;
              input.dispatchEvent(new Event('change',{bubbles:true}));
              const deadline=Date.now()+15000;
              while(Date.now()<deadline){
                const state=window.TallamFileCache.stateOf(input);
                if(state.state==='error') throw new Error(state.error);
                if(state.state==='ready') break;
                await new Promise(r=>setTimeout(r,50));
              }
              const stable=await window.TallamFileCache.getInputFile(input);
              if(!stable?.__tallamStableFile) throw new Error('Stable marker missing');
              document.body.dataset.result='success';
            }catch(error){
              document.body.dataset.result='error';
              document.body.dataset.error=String(error?.stack||error);
            }
          })();
          </script></body></html>
          HTML
          cd /tmp/android-photo-provider-test
          python3 -m http.server 8125 >/tmp/android-photo-provider-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID} 2>/dev/null || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          timeout 60s "$CHROME" --headless=new --disable-gpu --disable-dev-shm-usage --no-sandbox             --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8125/ > /tmp/android-photo-provider-dom.html
          grep -Fq 'data-result="success"' /tmp/android-photo-provider-dom.html
