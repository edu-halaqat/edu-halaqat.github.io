name: Verify Tallam Teachers Portal

on:
  push:
    branches: [main]
    paths:
      - "tallam/**"
      - ".github/workflows/verify-tallam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source and browser rendering
        shell: bash
        run: |
          set -euo pipefail
          test -f tallam/index.html
          test -f tallam/admin/index.html
          test -f tallam/assets/fragments/application-1.html
          test -f tallam/assets/fragments/application-2.html
          test -f tallam/assets/js/form-readiness.js
          for number in $(seq -w 1 14); do
            test -s "tallam/assets/js/ministry-bg-${number}.js"
          done

          node --check tallam/assets/js/bootstrap.js
          node --check tallam/assets/js/app-core.js
          node --check tallam/assets/js/form-readiness.js
          node --check tallam/assets/js/ministry-background.js
          node --check tallam/assets/js/ministry-export.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/admin/admin.js

          grep -q 'submitBtn.disabled = !ready' tallam/assets/js/form-readiness.js
          grep -q 'nextBtn.hidden = isLast' tallam/assets/js/form-readiness.js
          grep -q 'هذه هي الخطوة الأخيرة' tallam/assets/js/form-readiness.js
          grep -q '20260828-portal-final' tallam/assets/js/bootstrap.js

          python3 -m http.server 8000 --directory . >/tmp/tallam-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8000/tallam/ > /tmp/tallam-dom.html
          grep -q 'id="teacherForm"' /tmp/tallam-dom.html
          grep -q 'id="signatureCanvas"' /tmp/tallam-dom.html
          grep -q 'id="submissionReadiness"' /tmp/tallam-dom.html
          grep -q 'هذه هي الخطوة الأخيرة' /tmp/tallam-dom.html
          ! grep -q 'تعذر تحميل نموذج التسجيل' /tmp/tallam-dom.html
