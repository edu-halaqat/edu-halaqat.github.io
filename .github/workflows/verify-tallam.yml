name: Verify Tallam Teachers Portal

on:
  push:
    branches: [main]
    paths:
      - "tallam/**"
      - ".github/workflows/verify-tallam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          test -f tallam/index.html
          test -f tallam/admin/index.html
          test -f tallam/assets/js/ministry-export-lossless.js
          for number in $(seq -w 1 14); do test -s "tallam/assets/js/ministry-bg-${number}.js"; done

          node --check tallam/assets/js/bootstrap.js
          node --check tallam/assets/js/app-core.js
          node --check tallam/assets/js/ministry-background.js
          node --check tallam/assets/js/ministry-export-lossless.js
          node --check tallam/assets/js/app-submit.js
          node --check tallam/assets/js/form-readiness.js
          node --check tallam/admin/admin.js

          grep -q '20260828-lossless-rgb-v1' tallam/assets/js/bootstrap.js
          grep -q 'ministry-export-lossless.js' tallam/assets/js/bootstrap.js
          grep -q '/FlateDecode' tallam/assets/js/ministry-export-lossless.js
          grep -q 'form-image.png' tallam/assets/js/ministry-export-lossless.js
          ! grep -q '/DCTDecode' tallam/assets/js/ministry-export-lossless.js

      - name: Validate browser rendering and lossless Word/PDF generation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tallam-lossless-qa
          mkdir -p /tmp/tallam-lossless-qa
          cp tallam/assets/js/ministry-bg-*.js /tmp/tallam-lossless-qa/
          cp tallam/assets/js/ministry-background.js /tmp/tallam-lossless-qa/
          cp tallam/assets/js/ministry-export-lossless.js /tmp/tallam-lossless-qa/

          {
            cat <<'HTML'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
          HTML
            for number in $(seq -w 1 14); do
              printf '<script src="ministry-bg-%s.js"></script>\n' "$number"
            done
            cat <<'HTML'
          <script src="ministry-background.js"></script><script src="ministry-export-lossless.js"></script>
          </head><body data-export-test="pending">جارٍ اختبار التصدير
          <script>
          (async () => {
            const keepAlive = setInterval(() => document.documentElement.dataset.tick = String(Date.now()), 100);
            try {
              const signature = document.createElement("canvas");
              signature.width = 900; signature.height = 240;
              const context = signature.getContext("2d");
              context.strokeStyle = "#063f3d"; context.lineWidth = 10; context.lineCap = "round";
              context.beginPath(); context.moveTo(90, 165); context.bezierCurveTo(260, 40, 430, 220, 810, 80); context.stroke();
              const signatureBlob = await new Promise((resolve, reject) => signature.toBlob((blob) => blob ? resolve(blob) : reject(new Error("signature")), "image/png"));

              const photo = document.createElement("canvas");
              photo.width = 600; photo.height = 740;
              const pc = photo.getContext("2d");
              pc.fillStyle = "#fff"; pc.fillRect(0, 0, 600, 740);
              pc.fillStyle = "#ddb277"; pc.beginPath(); pc.arc(300, 180, 95, 0, Math.PI * 2); pc.fill();
              pc.fillStyle = "#006b69"; pc.fillRect(165, 300, 270, 330);
              const photoFile = await new Promise((resolve, reject) => photo.toBlob((blob) => blob ? resolve(new File([blob], "photo.png", { type: "image/png" })) : reject(new Error("photo")), "image/png"));

              const values = {
                full_name: "محمد أحمد عبد الله السلمي",
                identity_number: "1012345678",
                identity_type: "هوية وطنية",
                identity_expiry: "2030-12-30",
                nationality: "سعودي",
                gender: "ذكر",
                birth_place_date: "المدينة المنورة - 01/01/1410هـ",
                qualification: "بكالوريوس",
                specialization: "الدراسات القرآنية",
                workplace: "جمعية تعلّم",
                job_title: "معلم قرآن كريم",
                phone: "0140000000",
                mobile: "551234567",
                city: "المدينة المنورة",
                region: "منطقة المدينة المنورة",
                district: "الخالدية",
                street: "طريق الهجرة",
                building_number: "1234",
                apartment_number: "9",
                twitter: "tallam@",
                facebook: "لا يوجد",
                email: "teacher@example.com"
              };

              const output = await window.TallamMinistryExporter.generate({ values, photoFile, signatureBlob });
              if (output.exportBuild !== "20260828-lossless-rgb-v1") throw new Error("Wrong exporter build");
              if (!(output.docxBlob instanceof Blob) || output.docxBlob.size < 50000 || output.docxBlob.size > 8000000) throw new Error("Invalid Word output");
              if (!(output.pdfBlob instanceof Blob) || output.pdfBlob.size < 50000 || output.pdfBlob.size > 8000000) throw new Error("Invalid PDF output");

              const docxBytes = new Uint8Array(await output.docxBlob.arrayBuffer());
              if (docxBytes[0] !== 0x50 || docxBytes[1] !== 0x4b) throw new Error("Word is not a ZIP/DOCX");
              const docxText = new TextDecoder("latin1").decode(docxBytes);
              if (!docxText.includes("word/media/form-image.png")) throw new Error("Word PNG is missing");
              if (!docxText.includes("<wp:inline")) throw new Error("Word image is not inline");
              if (docxText.includes("official-filled-form.jpg")) throw new Error("Word still contains JPEG");

              const pdfBytes = new Uint8Array(await output.pdfBlob.arrayBuffer());
              const pdfText = new TextDecoder("latin1").decode(pdfBytes);
              if (!pdfText.startsWith("%PDF")) throw new Error("PDF header is invalid");
              if (!pdfText.includes("/FlateDecode")) throw new Error("PDF is not lossless Flate RGB");
              if (pdfText.includes("/DCTDecode")) throw new Error("PDF still contains JPEG");

              clearInterval(keepAlive);
              document.body.dataset.exportTest = "success";
              document.body.textContent = `EXPORT_OK DOCX=${output.docxBlob.size} PDF=${output.pdfBlob.size}`;
            } catch (error) {
              clearInterval(keepAlive);
              document.body.dataset.exportTest = "error";
              document.body.textContent = `EXPORT_ERROR ${error?.stack || error}`;
            }
          })();
          </script></body></html>
          HTML
          } > /tmp/tallam-lossless-qa/index.html

          python3 -m http.server 8765 --directory /tmp/tallam-lossless-qa >/tmp/tallam-lossless-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --run-all-compositor-stages-before-draw --virtual-time-budget=90000 --dump-dom \
            http://127.0.0.1:8765/ > /tmp/tallam-lossless-dom.html
          if ! grep -q 'data-export-test="success"' /tmp/tallam-lossless-dom.html; then
            cat /tmp/tallam-lossless-dom.html >&2
            exit 1
          fi
          grep -q 'EXPORT_OK DOCX=' /tmp/tallam-lossless-dom.html
          grep -q ' PDF=' /tmp/tallam-lossless-dom.html