name: Verify deployed Tallam portal

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260828-portal-final
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Run the corrected public verification suite
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/edu-halaqat/edu-halaqat.github.io/458de8f641deec4f8c208b647f28b72479cb56c9/.github/workflows/public-verify-tallam.yml \
            --output /tmp/public-verify-source.yml
          python3 <<'PY'
          from pathlib import Path

          lines = Path("/tmp/public-verify-source.yml").read_text(encoding="utf-8").splitlines()
          start = next(index for index, line in enumerate(lines) if line.strip() == "run: |")
          script = []
          for line in lines[start + 1:]:
              if line.startswith("          "):
                  script.append(line[10:])
              elif not line.strip():
                  script.append("")
              else:
                  break
          script = [line for line in script if "grep -Fq 'ministry-bg-14.js'" not in line]
          Path("/tmp/verify-tallam-public.sh").write_text("\n".join(script) + "\n", encoding="utf-8")
          PY
          bash /tmp/verify-tallam-public.sh
