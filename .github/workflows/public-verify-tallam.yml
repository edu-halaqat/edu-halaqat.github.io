name: Verify deployed Tallam portal

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260828-lossless-rgb-v1
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify public lossless export build
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${TARGET_SHA:-${GITHUB_SHA}}"

          fetch_expected() {
            local url="$1" output="$2" expected="$3"
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${url}?v=${BUILD}&sha=${target_sha}&attempt=${attempt}" \
                --output "${output}" \
                && test -s "${output}" \
                && grep -Fq "${expected}" "${output}"; then
                echo "Verified ${url}"
                return 0
              fi
              sleep 5
            done
            echo "Expected public content was not found at ${url}: ${expected}" >&2
            return 1
          }

          fetch_expected "${BASE_URL}/" /tmp/public-index.html "bootstrap.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/bootstrap.js" /tmp/public-bootstrap.js "${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/ministry-background.js" /tmp/public-background.js '103900'
          fetch_expected "${BASE_URL}/assets/js/ministry-export-lossless.js" /tmp/public-export.js 'EXPORT_BUILD = "20260828-lossless-rgb-v1"'
          fetch_expected "${BASE_URL}/assets/js/form-readiness.js" /tmp/public-readiness.js 'submitBtn.disabled = !ready'

          grep -Fq 'ministry-export-lossless.js' /tmp/public-bootstrap.js
          grep -Fq '/FlateDecode' /tmp/public-export.js
          grep -Fq 'form-image.png' /tmp/public-export.js
          ! grep -Fq '/DCTDecode' /tmp/public-export.js
          ! grep -Fq 'official-filled-form.jpg' /tmp/public-export.js

          for number in $(seq -w 1 14); do
            fetch_expected "${BASE_URL}/assets/js/ministry-bg-${number}.js" "/tmp/public-bg-${number}.js" '__TallamMinistryBackgroundParts'
          done

          rm -rf /tmp/tallam-public-lossless
          mkdir -p /tmp/tallam-public-lossless
          cp /tmp/public-bg-*.js /tmp/tallam-public-lossless/
          cp /tmp/public-background.js /tmp/tallam-public-lossless/ministry-background.js
          cp /tmp/public-export.js /tmp/tallam-public-lossless/ministry-export-lossless.js

          {
            cat <<'HTML'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
          HTML
            for number in $(seq -w 1 14); do
              printf '<script src="public-bg-%s.js"></script>\n' "$number"
            done
            cat <<'HTML'
          <script src="ministry-background.js"></script><script src="ministry-export-lossless.js"></script>
          </head><body data-export-test="pending">جارٍ اختبار النسخة العامة
          <script>
          (async () => {
            const keepAlive = setInterval(() => document.documentElement.dataset.tick = String(Date.now()), 100);
            try {
              const signature = document.createElement("canvas");
              signature.width = 900; signature.height = 240;
              const context = signature.getContext("2d");
              context.strokeStyle = "#063f3d"; context.lineWidth = 10; context.lineCap = "round";
              context.beginPath(); context.moveTo(90, 165); context.bezierCurveTo(260, 40, 430, 220, 810, 80); context.stroke();
              const signatureBlob = await new Promise((resolve, reject) => signature.toBlob((blob) => blob ? resolve(blob) : reject(new Error("signature")), "image/png"));
              const values = {
                full_name: "اختبار التصدير العام",
                identity_number: "1234567890",
                identity_type: "إقامة",
                identity_expiry: "2030-01-01",
                nationality: "اختبار",
                gender: "ذكر",
                birth_place_date: "المدينة المنورة - 1990/01/01م",
                qualification: "جامعي",
                specialization: "قراءات",
                workplace: "جمعية تعلّم",
                job_title: "معلم قرآن",
                phone: "لا يوجد",
                mobile: "0500000000",
                city: "المدينة المنورة",
                region: "منطقة المدينة المنورة",
                district: "اختبار",
                street: "اختبار",
                building_number: "1000",
                apartment_number: "1",
                twitter: "لا يوجد",
                facebook: "لا يوجد",
                email: "qa@example.com"
              };
              const output = await window.TallamMinistryExporter.generate({ values, photoFile: null, signatureBlob });
              if (output.exportBuild !== "20260828-lossless-rgb-v1") throw new Error("Wrong public exporter build");
              if (!(output.docxBlob instanceof Blob) || output.docxBlob.size < 50000 || output.docxBlob.size > 8000000) throw new Error("Invalid Word output");
              if (!(output.pdfBlob instanceof Blob) || output.pdfBlob.size < 50000 || output.pdfBlob.size > 8000000) throw new Error("Invalid PDF output");

              const docxBytes = new Uint8Array(await output.docxBlob.arrayBuffer());
              const docxText = new TextDecoder("latin1").decode(docxBytes);
              if (docxBytes[0] !== 0x50 || docxBytes[1] !== 0x4b) throw new Error("Word header is invalid");
              if (!docxText.includes("word/media/form-image.png") || !docxText.includes("<wp:inline")) throw new Error("Word lossless structure is invalid");
              if (docxText.includes("official-filled-form.jpg")) throw new Error("Word contains JPEG");

              const pdfBytes = new Uint8Array(await output.pdfBlob.arrayBuffer());
              const pdfText = new TextDecoder("latin1").decode(pdfBytes);
              if (!pdfText.startsWith("%PDF") || !pdfText.includes("/FlateDecode")) throw new Error("PDF lossless structure is invalid");
              if (pdfText.includes("/DCTDecode")) throw new Error("PDF contains JPEG");

              clearInterval(keepAlive);
              document.body.dataset.exportTest = "success";
              document.body.textContent = `EXPORT_OK DOCX=${output.docxBlob.size} PDF=${output.pdfBlob.size}`;
            } catch (error) {
              clearInterval(keepAlive);
              document.body.dataset.exportTest = "error";
              document.body.textContent = `EXPORT_ERROR ${error?.stack || error}`;
            }
          })();
          </script></body></html>
          HTML
          } > /tmp/tallam-public-lossless/index.html

          python3 -m http.server 8765 --directory /tmp/tallam-public-lossless >/tmp/tallam-public-lossless-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --run-all-compositor-stages-before-draw --virtual-time-budget=90000 --dump-dom \
            http://127.0.0.1:8765/ > /tmp/tallam-public-lossless-dom.html
          if ! grep -q 'data-export-test="success"' /tmp/tallam-public-lossless-dom.html; then
            cat /tmp/tallam-public-lossless-dom.html >&2
            exit 1
          fi
          grep -q 'EXPORT_OK DOCX=' /tmp/tallam-public-lossless-dom.html
          grep -q ' PDF=' /tmp/tallam-public-lossless-dom.html