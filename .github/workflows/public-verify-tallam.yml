name: Verify deployed Tallam portal

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260901-synchronized-export-repair-v2
    steps:
      - name: Verify public synchronized release
        shell: bash
        run: |
          set -euo pipefail
          fetch_expected() {
            local url="$1" output="$2" expected="$3"
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${url}?v=${BUILD}&attempt=${attempt}" --output "$output" \
                && test -s "$output" && grep -Fq "$expected" "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          mkdir -p /tmp/tallam-live
          fetch_expected "${BASE_URL}/" /tmp/tallam-live/index.html "bootstrap.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/bootstrap.js" /tmp/tallam-live/bootstrap.js "$BUILD"
          fetch_expected "${BASE_URL}/assets/js/app-submit.js" /tmp/tallam-live/submit.js "ministry_form_preview"
          fetch_expected "${BASE_URL}/assets/js/ministry-preview-renderer.js" /tmp/tallam-live/renderer.js "4.0.0-synchronized-page-v1"
          fetch_expected "${BASE_URL}/admin/" /tmp/tallam-live/admin.html "regenerate.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/admin/regenerate.js" /tmp/tallam-live/regenerate.js "teacher-export-repair"
          fetch_expected "${BASE_URL}/admin/archive-refresh-bridge.js" /tmp/tallam-live/archive-bridge.js "masterArchiveRebuild"

          node --check /tmp/tallam-live/bootstrap.js
          node --check /tmp/tallam-live/submit.js
          node --check /tmp/tallam-live/renderer.js
          node --check /tmp/tallam-live/regenerate.js
          node --check /tmp/tallam-live/archive-bridge.js

          grep -Fq 'download_urls' /tmp/tallam-live/submit.js
          grep -Fq 'TallamMinistryPreviewRenderer' /tmp/tallam-live/bootstrap.js
          grep -Fq 'إعادة توليد التالفة ومزامنتها' /tmp/tallam-live/regenerate.js
          grep -Fq 'tallam:archive-refresh' /tmp/tallam-live/regenerate.js
          ! grep -Fq 'ministry-export-final.js' /tmp/tallam-live/bootstrap.js
          ! grep -Fq 'data.append("ministry_form_docx"' /tmp/tallam-live/submit.js
          ! grep -Fq 'data.append("ministry_form_pdf"' /tmp/tallam-live/submit.js

          for number in $(seq -w 1 14); do
            fetch_expected "${BASE_URL}/assets/js/ministry-bg-${number}.js" "/tmp/tallam-live/ministry-bg-${number}.js" "TallamMinistryBackgroundParts"
          done
          fetch_expected "${BASE_URL}/assets/js/ministry-background.js" /tmp/tallam-live/ministry-background.js "TallamOfficialMinistryBackground"

          node <<'NODE'
          const crypto = require('crypto');
          global.window = global;
          for (let index = 1; index <= 14; index += 1) {
            require(`/tmp/tallam-live/ministry-bg-${String(index).padStart(2, '0')}.js`);
          }
          require('/tmp/tallam-live/ministry-background.js');
          const prefix = 'data:image/webp;base64,';
          const source = String(global.TallamOfficialMinistryBackground || '');
          if (!source.startsWith(prefix)) throw new Error('Public ministry background was not assembled.');
          const bytes = Buffer.from(source.slice(prefix.length), 'base64');
          const sha256 = crypto.createHash('sha256').update(bytes).digest('hex');
          if (bytes.length !== 77924) throw new Error(`Unexpected WebP size: ${bytes.length}`);
          if (sha256 !== '977bf87fa55a137b85734c72f0dc86d3c37612dc5d2f7f3fd6234ec0fca4bb6f') {
            throw new Error(`Unexpected WebP SHA-256: ${sha256}`);
          }
          console.log(`Public official background verified: ${bytes.length} bytes`);
          NODE

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for attempt in $(seq 1 12); do
            timeout 45s "$CHROME" --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=20000 --dump-dom \
              "${BASE_URL}/?v=${BUILD}&browser_attempt=${attempt}" \
              > /tmp/tallam-live/index-dom.html 2>/tmp/tallam-live/chrome-index.log || true
            if grep -Fq 'data-portal-ready="true"' /tmp/tallam-live/index-dom.html \
              && grep -Fq 'id="teacherForm"' /tmp/tallam-live/index-dom.html; then
              break
            fi
            sleep 5
          done
          grep -Fq 'data-portal-ready="true"' /tmp/tallam-live/index-dom.html
          grep -Fq 'data-ministry-background-ready="true"' /tmp/tallam-live/index-dom.html
          grep -Fq 'id="teacherForm"' /tmp/tallam-live/index-dom.html
          ! grep -Fq 'data-portal-ready="false"' /tmp/tallam-live/index-dom.html

          timeout 45s "$CHROME" --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=12000 --dump-dom \
            "${BASE_URL}/admin/?v=${BUILD}" \
            > /tmp/tallam-live/admin-dom.html 2>/tmp/tallam-live/chrome-admin.log
          grep -Fq 'value="Mad3@tallam.sa"' /tmp/tallam-live/admin-dom.html
          grep -Fq 'id="exportRepairPanel"' /tmp/tallam-live/admin-dom.html
          grep -Fq 'إعادة توليد التالفة ومزامنتها' /tmp/tallam-live/admin-dom.html

          echo 'Public Tallam synchronized export release verified successfully.'
