name: Verify deployed Tallam portal

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260829-final-png-v1
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify public page and final export assets
        shell: bash
        run: |
          set -euo pipefail
          target_sha="${TARGET_SHA:-${GITHUB_SHA}}"

          fetch_expected() {
            local url="$1"
            local output="$2"
            local expected="$3"
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${url}?v=${BUILD}&sha=${target_sha}&attempt=${attempt}" \
                --output "${output}" \
                && test -s "${output}" \
                && grep -Fq "${expected}" "${output}"; then
                echo "Verified ${url}"
                return 0
              fi
              sleep 5
            done
            echo "Expected deployed content was not found at ${url}: ${expected}" >&2
            sed -n '1,30p' "${output}" >&2 2>/dev/null || true
            return 1
          }

          fetch_expected "${BASE_URL}/" /tmp/tallam-public-index.html "bootstrap.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/bootstrap.js" /tmp/tallam-public-bootstrap.js "${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/ministry-export-final.js" /tmp/tallam-public-exporter.js "const EXPORT_BUILD = \"${BUILD}\""
          fetch_expected "${BASE_URL}/assets/js/form-readiness.js" /tmp/tallam-public-readiness.js 'submitBtn.disabled = !ready'

          grep -Fq 'ministry-form-background.png' /tmp/tallam-public-bootstrap.js
          grep -Fq 'ministry-export-final.js' /tmp/tallam-public-bootstrap.js
          ! grep -Fq 'ministry-bg-' /tmp/tallam-public-bootstrap.js
          ! grep -Fq 'ministry-background.js' /tmp/tallam-public-bootstrap.js
          grep -Fq '/FlateDecode' /tmp/tallam-public-exporter.js
          grep -Fq 'form-image.png' /tmp/tallam-public-exporter.js
          ! grep -Fq '/DCTDecode' /tmp/tallam-public-exporter.js
          ! grep -Fq 'dark / total > 0.18' /tmp/tallam-public-exporter.js

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${BASE_URL}/assets/img/ministry-form-background.png?v=${BUILD}&sha=${target_sha}&attempt=${attempt}" \
              --output /tmp/tallam-public-background.png \
              && test "$(wc -c </tmp/tallam-public-background.png)" -gt 100000; then
              break
            fi
            sleep 5
          done

          python3 -m pip install --quiet pillow
          python3 <<'PY'
          from PIL import Image
          path = "/tmp/tallam-public-background.png"
          with Image.open(path) as image:
              assert image.size == (1414, 2000), image.size
              rgb = image.convert("RGB")
              anchors = {
                  (15, 15): (255, 255, 255),
                  (1375, 1970): (255, 255, 255),
                  (1000, 450): (194, 214, 155),
                  (900, 650): (234, 241, 221),
              }
              for point, expected in anchors.items():
                  actual = rgb.getpixel(point)
                  assert max(abs(actual[i] - expected[i]) for i in range(3)) <= 18, (point, actual, expected)
          print("Public official PNG verified")
          PY

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"

          rendered=false
          for attempt in $(seq 1 18); do
            rm -rf "/tmp/chrome-tallam-${attempt}"
            "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --disable-application-cache --disk-cache-size=1 \
              --user-data-dir="/tmp/chrome-tallam-${attempt}" \
              --virtual-time-budget=30000 --dump-dom \
              "${BASE_URL}/?v=${BUILD}&sha=${target_sha}&render=${attempt}" > /tmp/tallam-public-dom.html || true
            if grep -q 'id="teacherForm"' /tmp/tallam-public-dom.html \
              && grep -q 'id="submissionReadiness"' /tmp/tallam-public-dom.html \
              && ! grep -q 'تعذر تحميل نموذج التسجيل' /tmp/tallam-public-dom.html; then
              rendered=true
              break
            fi
            sleep 5
          done
          test "$rendered" = true

          rm -rf /tmp/tallam-public-export-qa
          mkdir -p /tmp/tallam-public-export-qa
          cp /tmp/tallam-public-background.png /tmp/tallam-public-export-qa/ministry-form-background.png
          cp /tmp/tallam-public-exporter.js /tmp/tallam-public-export-qa/ministry-export-final.js

          cat > /tmp/tallam-public-export-qa/index.html <<'HTML'
          <!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
          <script>window.TallamOfficialMinistryBackground="ministry-form-background.png";</script>
          <script src="ministry-export-final.js"></script></head>
          <body data-export-test="pending">جارٍ اختبار التصدير العام
          <script>
          (async () => {
            const keepAlive = setInterval(() => document.documentElement.dataset.tick = String(Date.now()), 100);
            try {
              const signature = document.createElement("canvas");
              signature.width = 900; signature.height = 240;
              const context = signature.getContext("2d");
              context.strokeStyle = "#063f3d"; context.lineWidth = 10; context.lineCap = "round";
              context.beginPath(); context.moveTo(90, 165); context.bezierCurveTo(260, 40, 430, 220, 810, 80); context.stroke();
              const signatureBlob = await new Promise((resolve, reject) => signature.toBlob((blob) => blob ? resolve(blob) : reject(new Error("signature")), "image/png"));
              const values = {
                full_name: "اختبار التصدير العام النهائي",
                identity_number: "1012345678",
                identity_type: "هوية وطنية",
                identity_expiry: "2030-12-30",
                nationality: "سعودي",
                gender: "ذكر",
                birth_place_date: "المدينة المنورة - 01/01/1410هـ",
                qualification: "بكالوريوس",
                specialization: "الدراسات القرآنية",
                workplace: "جمعية تعلّم",
                job_title: "معلم قرآن كريم",
                phone: "0140000000",
                mobile: "551234567",
                city: "المدينة المنورة",
                region: "منطقة المدينة المنورة",
                district: "الخالدية",
                street: "طريق الهجرة",
                building_number: "1234",
                apartment_number: "9",
                twitter: "لا يوجد",
                facebook: "لا يوجد",
                email: "qa@example.com"
              };
              const output = await window.TallamMinistryExporter.generate({ values, photoFile: null, signatureBlob });
              if (output.exportBuild !== "20260829-final-png-v1") throw new Error("Wrong public exporter build");
              if (!(output.docxBlob instanceof Blob) || output.docxBlob.size < 100000 || output.docxBlob.size > 8000000) throw new Error("Invalid public Word output");
              if (!(output.pdfBlob instanceof Blob) || output.pdfBlob.size < 100000 || output.pdfBlob.size > 8000000) throw new Error("Invalid public PDF output");
              const docx = new Uint8Array(await output.docxBlob.slice(0, 4).arrayBuffer());
              const pdf = new TextDecoder().decode(await output.pdfBlob.slice(0, 4).arrayBuffer());
              if (docx[0] !== 0x50 || docx[1] !== 0x4b) throw new Error("Public Word header is invalid");
              if (pdf !== "%PDF") throw new Error("Public PDF header is invalid");
              clearInterval(keepAlive);
              document.body.dataset.exportTest = "success";
              document.body.textContent = `EXPORT_OK DOCX=${output.docxBlob.size} PDF=${output.pdfBlob.size}`;
            } catch (error) {
              clearInterval(keepAlive);
              document.body.dataset.exportTest = "error";
              document.body.textContent = `EXPORT_ERROR ${error?.stack || error}`;
            }
          })();
          </script></body></html>
          HTML

          python3 -m http.server 8765 --directory /tmp/tallam-public-export-qa >/tmp/tallam-public-export-http.log 2>&1 &
          export_server=$!
          trap 'kill "$export_server" 2>/dev/null || true' EXIT
          sleep 2
          rm -rf /tmp/chrome-tallam-export
          "$browser" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --user-data-dir=/tmp/chrome-tallam-export \
            --run-all-compositor-stages-before-draw --virtual-time-budget=90000 --dump-dom \
            http://127.0.0.1:8765/ > /tmp/tallam-public-export-dom.html
          if ! grep -q 'data-export-test="success"' /tmp/tallam-public-export-dom.html; then
            cat /tmp/tallam-public-export-dom.html >&2
            exit 1
          fi
          grep -q 'EXPORT_OK DOCX=' /tmp/tallam-public-export-dom.html
          grep -q ' PDF=' /tmp/tallam-public-export-dom.html
          echo "Public Tallam portal and final Word/PDF exporter verified successfully."
