name: Verify deployed Tallam portal

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260830-final-png-v2
    steps:
      - name: Verify public release
        shell: bash
        run: |
          set -euo pipefail
          fetch_expected() {
            local url="$1" output="$2" expected="$3"
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${url}?v=${BUILD}&attempt=${attempt}" --output "$output" \
                && test -s "$output" && grep -Fq "$expected" "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          mkdir -p /tmp/tallam-live
          fetch_expected "${BASE_URL}/" /tmp/tallam-live/index.html "bootstrap.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/assets/js/bootstrap.js" /tmp/tallam-live/bootstrap.js "$BUILD"
          fetch_expected "${BASE_URL}/assets/js/ministry-export-final.js" /tmp/tallam-live/exporter.js "TallamMinistryExporter"
          grep -Fq '/FlateDecode' /tmp/tallam-live/exporter.js
          ! grep -Fq '/DCTDecode' /tmp/tallam-live/exporter.js

          for attempt in $(seq 1 36); do
            if curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache, no-store, must-revalidate' \
              "${BASE_URL}/assets/img/ministry-form-background.png?v=${BUILD}&attempt=${attempt}" \
              --output /tmp/tallam-live/background.png \
              && test -s /tmp/tallam-live/background.png; then
              break
            fi
            sleep 5
          done

          python3 <<'PY'
          from pathlib import Path
          import struct
          data = Path('/tmp/tallam-live/background.png').read_bytes()
          assert len(data) > 30_000
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (1414, 2000)
          print('Public Tallam release verified')
          PY