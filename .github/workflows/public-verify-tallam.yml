name: Verify deployed Tallam portal

on:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://edu-halaqat.github.io/tallam
      BUILD: 20260902-manual-ministry-form-v1
      TEMPLATE_URL: https://fvzoogbdezueswyihxiz.supabase.co/functions/v1/ministry-form-template
    steps:
      - name: Verify public manual ministry form release
        shell: bash
        run: |
          set -euo pipefail
          fetch_expected() {
            local url="$1" output="$2" expected="$3"
            for attempt in $(seq 1 36); do
              if curl --fail --silent --show-error --location --max-time 30 \
                -H 'Cache-Control: no-cache, no-store, must-revalidate' \
                "${url}?v=${BUILD}&attempt=${attempt}" --output "$output" \
                && test -s "$output" && grep -Fq "$expected" "$output"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          mkdir -p /tmp/tallam-live
          fetch_expected "${BASE_URL}/" /tmp/tallam-live/index.html "bootstrap.js?v=${BUILD}"
          fetch_expected "${BASE_URL}/assets/fragments/application-2.html" /tmp/tallam-live/application-2.html "ministry_form_filled"
          fetch_expected "${BASE_URL}/assets/js/bootstrap.js" /tmp/tallam-live/bootstrap.js "$BUILD"
          fetch_expected "${BASE_URL}/assets/js/app-submit.js" /tmp/tallam-live/submit.js "manual-ministry-form-v1"
          fetch_expected "${BASE_URL}/assets/js/form-readiness-v2.js" /tmp/tallam-live/readiness.js "$BUILD"
          fetch_expected "${BASE_URL}/admin/" /tmp/tallam-live/admin.html "admin.js?v=${BUILD}"

          node --check /tmp/tallam-live/bootstrap.js
          node --check /tmp/tallam-live/submit.js
          node --check /tmp/tallam-live/readiness.js
          grep -Fq 'ministry-form-template' /tmp/tallam-live/application-2.html
          grep -Fq 'ministry_form_filled' /tmp/tallam-live/submit.js
          grep -Fq 'ministry_form_filled' /tmp/tallam-live/readiness.js
          grep -Fq 'إرسال الطلب</button>' /tmp/tallam-live/application-2.html
          ! grep -Fq 'TallamMinistryPreviewRenderer' /tmp/tallam-live/bootstrap.js
          ! grep -Fq 'ministry_form_preview' /tmp/tallam-live/submit.js
          ! grep -Fq 'regenerate.js?v=' /tmp/tallam-live/admin.html
          ! grep -Fq 'archive.js?v=' /tmp/tallam-live/admin.html

          curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$TEMPLATE_URL" -o /tmp/tallam-live/ministry-template.docx
          test "$(stat -c%s /tmp/tallam-live/ministry-template.docx)" -gt 10000
          unzip -t /tmp/tallam-live/ministry-template.docx >/dev/null
          unzip -l /tmp/tallam-live/ministry-template.docx | grep -Fq 'word/document.xml'

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          for attempt in $(seq 1 12); do
            timeout 45s "$CHROME" --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=18000 --dump-dom \
              "${BASE_URL}/?v=${BUILD}&browser_attempt=${attempt}" \
              > /tmp/tallam-live/index-dom.html 2>/tmp/tallam-live/chrome-index.log || true
            if grep -Fq 'data-portal-ready="true"' /tmp/tallam-live/index-dom.html \
              && grep -Fq 'name="ministry_form_filled"' /tmp/tallam-live/index-dom.html \
              && grep -Fq 'تنزيل استمارة الشؤون الإسلامية' /tmp/tallam-live/index-dom.html; then
              break
            fi
            sleep 5
          done
          grep -Fq 'data-portal-ready="true"' /tmp/tallam-live/index-dom.html
          grep -Fq 'name="ministry_form_filled"' /tmp/tallam-live/index-dom.html
          grep -Fq 'تنزيل استمارة الشؤون الإسلامية' /tmp/tallam-live/index-dom.html
          grep -Fq 'تزكية الشيخ الأول <small>(اختياري)</small>' /tmp/tallam-live/index-dom.html
          grep -Fq 'تزكية الشيخ الثاني <small>(اختياري)</small>' /tmp/tallam-live/index-dom.html
          ! grep -Fq 'id="downloadWord"' /tmp/tallam-live/index-dom.html
          ! grep -Fq 'id="downloadPdf"' /tmp/tallam-live/index-dom.html
          ! grep -Fq 'data-portal-ready="false"' /tmp/tallam-live/index-dom.html

          echo 'Public Tallam manual ministry form release verified successfully.'
